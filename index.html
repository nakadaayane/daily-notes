<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Daily Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: chat-app shell. Left = history of topics (search, likes, word book), right = one topic read like a conversation, composer pinned at the bottom. */
:root{
  --bg:#f9f8f4; --side:#f1efe8; --card:#fffefb; --fg:#2e2c28; --muted:#77736b; --faint:#a7a299;
  --line:#e3dfd5; --bubble:#ece9e1; --accent:#a3624a; --accent-soft:#f2e5de; --hl:#f3ead4;
  --good:#3d7650; --good-soft:#e1eee4; --bad:#a24d3c; --bad-soft:#f5e2dd;
  --dot-movie:#7f90a5; --dot-anime:#7e9b7d; --dot-manga:#b48a6c; --dot-own:#9a8fb0;
  --shadow:rgba(46,38,30,.10);
  --serif:"Source Serif 4", Georgia, "Times New Roman", "Yu Gothic UI", "Hiragino Sans", Meiryo, serif;
  --ui:system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  --fs-xs:.6875rem; --fs-s:.75rem; --fs-m:.84375rem; --fs-l:.9375rem; --fs-xl:1.0625rem;
  --ease:cubic-bezier(.2,.7,.2,1); --quick:.14s;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#262523; --side:#1d1c1a; --card:#2c2a27; --fg:#ebe8e1; --muted:#a29e95; --faint:#76726a;
    --line:#393733; --bubble:#34322e; --accent:#d58c6f; --accent-soft:#3c2b24; --hl:#3a3323;
    --good:#86c497; --good-soft:#233128; --bad:#e3907c; --bad-soft:#3a2521;
    --dot-movie:#8ea0b6; --dot-anime:#8fae8d; --dot-manga:#c79c7d; --dot-own:#ab9fc4;
    --shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#262523; --side:#1d1c1a; --card:#2c2a27; --fg:#ebe8e1; --muted:#a29e95; --faint:#76726a;
  --line:#393733; --bubble:#34322e; --accent:#d58c6f; --accent-soft:#3c2b24; --hl:#3a3323;
  --good:#86c497; --good-soft:#233128; --bad:#e3907c; --bad-soft:#3a2521;
  --dot-movie:#8ea0b6; --dot-anime:#8fae8d; --dot-manga:#c79c7d; --dot-own:#ab9fc4;
  --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:var(--fs-m);line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;transition:background-color var(--quick),color var(--quick),border-color var(--quick)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--hl)}
svg{display:block;flex:none}
.list,.scroll{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
kbd{font-family:var(--ui);font-size:.625rem;line-height:1;color:var(--faint);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 4px;background:var(--card)}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px 18px}
.brand{font-family:var(--serif);font-size:var(--fs-l);letter-spacing:.01em}
.search{position:relative;margin:2px 10px 6px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 30px 5px 28px;font-size:var(--fs-s);outline:0;transition:border-color var(--quick)}
.search input:focus{border-color:var(--faint)}
.search input::placeholder{color:var(--faint)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.search input:focus ~ kbd,.search input:not(:placeholder-shown) ~ kbd{display:none}
.side-actions{display:flex;flex-direction:column;gap:1px;padding:2px 8px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border-radius:8px;font-size:var(--fs-s);text-align:left;color:var(--fg)}
.nav-btn svg{color:var(--muted)}
.nav-btn:hover,.nav-btn[aria-current="true"]{background:var(--bubble)}
.nav-btn .cnt{margin-left:auto;color:var(--faint);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:3px;padding:6px 12px 4px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.filters::-webkit-scrollbar{display:none}
.filters.end{-webkit-mask-image:none;mask-image:none}
.chip{flex:none;font-size:var(--fs-xs);padding:1px 9px;border-radius:999px;color:var(--muted);border:1px solid transparent}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--line);background:var(--card);color:var(--fg)}
.list{flex:1;overflow-y:auto;padding:2px 8px 14px;min-height:0}
.grp{font-size:var(--fs-xs);color:var(--faint);padding:14px 10px 3px;display:flex;justify-content:space-between}
.item{scroll-margin:30px 0 8px;display:flex;align-items:center;gap:8px;width:100%;padding:5px 10px;border-radius:8px;font-size:var(--fs-s);text-align:left;color:var(--fg)}
.item:hover,.item[aria-current="true"]{background:var(--bubble)}
.item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item mark{background:var(--hl);color:inherit;border-radius:2px}
.item .marks{display:flex;align-items:center;gap:4px;color:var(--faint);font-size:var(--fs-xs)}
.item .marks .lk{color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--faint)}
.dot.movie{background:var(--dot-movie)}.dot.anime{background:var(--dot-anime)}.dot.manga{background:var(--dot-manga)}.dot.own{background:var(--dot-own)}
.side-foot{border-top:1px solid var(--line);padding:9px 14px 11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted)}
.side-foot .sp{flex:1}
.foot-btn{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:var(--fs-xs);padding:2px 4px;border-radius:5px}
.foot-btn:hover{color:var(--fg);background:var(--bubble)}
.empty-side{color:var(--faint);font-size:var(--fs-s);padding:12px 10px;line-height:1.7}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.topbar{display:flex;align-items:center;gap:4px;height:46px;padding:0 10px 0 18px;flex:none;position:relative}
.topbar::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:calc(var(--p,0) * 100%);background:var(--accent);opacity:.55;transition:width .1s linear}
.top-title{flex:1;min-width:0;font-size:var(--fs-s);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--bubble);color:var(--fg)}
.only-mobile{display:none}
.scroll{flex:1;overflow-y:auto;min-height:0}
.thread{max-width:720px;margin:0 auto;padding-block:6px 48px;padding-inline:24px;display:flex;flex-direction:column;gap:22px}
.thread.enter > *{animation:rise .34s var(--ease) both}
.thread.enter > *:nth-child(2){animation-delay:.04s}
.thread.enter > *:nth-child(3){animation-delay:.08s}
.thread.enter > *:nth-child(n+4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* heart (like) */
.heart[aria-pressed="true"]{color:var(--accent)}
.heart[aria-pressed="true"] svg path{fill:currentColor}
.heart.pop svg{animation:pop .44s var(--ease)}
.heart.pop::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px solid var(--accent);animation:ring .55s var(--ease) forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.3)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes ring{from{transform:scale(.55);opacity:.8}to{transform:scale(1.45);opacity:0}}

/* user bubble */
.u-row{display:flex;justify-content:flex-end}
.u-bubble{background:var(--bubble);border-radius:16px;padding:9px 14px;max-width:min(520px,88%);overflow-wrap:anywhere}
.u-bubble .src{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:1px}
.u-bubble a{color:inherit;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}

/* assistant answer */
.a-block{display:flex;flex-direction:column;gap:22px;font-family:var(--serif);font-size:var(--fs-l);line-height:1.7}
.a-block p{margin:0}
.lead{margin:0;text-wrap:pretty}
.meta-line{font-family:var(--ui);font-size:var(--fs-xs);color:var(--faint);display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:-12px}
.blk{display:flex;flex-direction:column;gap:9px}
.blk-h{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.blk h3{margin:0;font-family:var(--ui);font-size:var(--fs-m);font-weight:600;letter-spacing:.01em}
.blk-h .sp{flex:1}
.note{font-family:var(--ui);font-size:var(--fs-xs);color:var(--faint);margin:0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card);font-family:var(--ui)}
.seg button{font-size:var(--fs-xs);padding:1px 10px;border-radius:999px;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--bubble);color:var(--fg)}
.txt-btn{font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px}
.txt-btn:hover{color:var(--fg);background:var(--bubble)}
.txt-btn[data-on="1"]{color:var(--accent)}

.story{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.story li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;margin-inline:-8px;border-radius:8px;cursor:pointer;transition:background-color .2s}
.story li:hover{background:color-mix(in srgb,var(--bubble) 55%,transparent)}
.story li.speaking{background:color-mix(in srgb,var(--hl) 55%,transparent)}
.story .s-body{flex:1;min-width:0}
.story .s-body.swap{animation:swap .22s var(--ease)}
@keyframes swap{from{opacity:.15;transform:translateY(2px)}to{opacity:1;transform:none}}
.story .s-text.ja{font-family:var(--ui);font-size:var(--fs-m)}
.story .s-sub{display:block;font-family:var(--ui);font-size:var(--fs-s);color:var(--muted);margin-top:1px}
.mw{font-family:var(--serif);font-size:1.06em;background:var(--hl);padding:0 3px;border-radius:3px}
.tk{border-radius:3px;transition:background-color .12s,box-shadow .12s}
.tk.kw{text-decoration:underline dotted;text-decoration-color:var(--faint);text-decoration-thickness:1px;text-underline-offset:4px;cursor:help}
.tk.kw:hover,.tk.kw:focus-visible{color:var(--accent);text-decoration-color:var(--accent);outline:0}
.tk.now{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.say{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--faint)}
.say:hover{color:var(--fg);background:var(--bubble)}

.words{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.words li{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.words .wtxt{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;min-width:0}
.words .w{font-family:var(--serif);font-size:var(--fs-l);font-weight:600}
.words .m{font-family:var(--ui);font-size:var(--fs-m)}
.words .n{font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted);flex-basis:100%;line-height:1.6}
.words .n button{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;font-size:inherit}
.words .n button:hover{color:var(--fg)}
.words.blur .m{filter:blur(5px);cursor:pointer;transition:filter .15s}
.words.blur .m.show{filter:none}
.star{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--faint)}
.star:hover{background:var(--bubble);color:var(--fg)}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg path{fill:currentColor}

.gram{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.gram .g-body{font-family:var(--ui);font-size:var(--fs-m)}
.ex{margin:0}
.ex .ja{display:block;font-family:var(--ui);font-size:var(--fs-s);color:var(--muted)}

.quiz{display:flex;flex-direction:column;gap:16px;font-family:var(--ui);font-size:var(--fs-m)}
.q-t{margin:0 0 6px}
.q-n{color:var(--faint);font-variant-numeric:tabular-nums;margin-right:4px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;text-align:left;display:inline-flex;align-items:center;gap:6px}
.choice:hover:not(:disabled){border-color:var(--faint)}
.choice:disabled{cursor:default}
.choice.dim{opacity:.55}
.choice.right{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:1}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);opacity:1}
.choice.right.picked{animation:nudge .32s var(--ease)}
.choice.wrong{animation:shake .3s var(--ease)}
@keyframes nudge{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.q-why{margin:6px 0 0;font-size:var(--fs-s);color:var(--muted)}
.q-res{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--fs-s);color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.q-res b{color:var(--fg);font-weight:600}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.r{background:var(--good)}.dots i.w{background:var(--bad)}

.talk-q{font-size:var(--fs-xl);margin:0;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.talk-ja{font-family:var(--ui);font-size:var(--fs-s);color:var(--muted)}
.pill{font-family:var(--ui);font-size:var(--fs-s);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;display:inline-flex;align-items:center;gap:6px;position:relative}
.pill:hover{border-color:var(--faint)}
.pill.heart[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft)}

.end-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--ui);border-top:1px solid var(--line);padding-top:14px}
.src-foot{flex:1;min-width:0;font-size:var(--fs-xs);color:var(--faint)}
.src-foot a{color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:var(--ui)}
.pager button{border:1px solid var(--line);border-radius:12px;padding:9px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.pager button:hover{background:var(--card);border-color:var(--faint)}
.pager .lbl{font-size:var(--fs-xs);color:var(--faint);display:flex;align-items:center;gap:6px}
.pager .ttl{font-size:var(--fs-s);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pager .next{grid-column:2;text-align:right;align-items:flex-end}
.pager .next .lbl{flex-direction:row-reverse}

/* chat */
.chat{display:flex;flex-direction:column;gap:18px}
.a-msg{font-family:var(--serif);font-size:var(--fs-l);line-height:1.7;display:flex;flex-direction:column;gap:8px}
.a-msg p{margin:0}
.a-msg ul{margin:0;padding-left:1.2em}
.a-msg .tr{font-family:var(--ui);font-size:var(--fs-s);color:var(--muted)}
.a-msg .fix{font-family:var(--ui);font-size:var(--fs-s);background:var(--accent-soft);border-radius:8px;padding:6px 10px}
.a-msg .thinking{font-family:var(--ui);font-size:var(--fs-s);color:var(--faint)}
.a-msg .thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.a-msg .err{font-family:var(--ui);font-size:var(--fs-s);color:var(--bad)}
.a-tools{display:flex;gap:4px}

/* composer */
.composer{flex:none;padding:0 24px calc(14px + env(safe-area-inset-bottom,0px))}
.comp-box{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 12px 7px;box-shadow:0 1px 6px var(--shadow);transition:border-color var(--quick)}
.comp-box:focus-within{border-color:var(--faint)}
.comp-box textarea{width:100%;border:0;outline:0;background:transparent;resize:none;font-size:var(--fs-m);line-height:1.6;max-height:180px;padding:2px 4px}
.comp-row{display:flex;align-items:center;gap:8px;margin-top:3px}
.comp-note{flex:1;min-width:0;font-size:var(--fs-xs);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--fg);color:var(--bg)}
.send:disabled{opacity:.35;cursor:default}

/* other views */
.view-head{display:flex;flex-direction:column;gap:4px;margin-top:22px}
.view-h{font-family:var(--serif);font-size:1.25rem;font-weight:400;margin:0;text-wrap:balance;display:flex;align-items:baseline;gap:10px}
.view-h .c{font-family:var(--ui);font-size:var(--fs-s);color:var(--faint);font-variant-numeric:tabular-nums}
.view-p{color:var(--muted);font-size:var(--fs-s);margin:0}
.field{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:var(--fs-m);line-height:1.6;outline:0}
.field:focus{border-color:var(--faint)}
.btn{background:var(--fg);color:var(--bg);border-radius:10px;padding:6px 16px;font-size:var(--fs-s)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--faint)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.draft-bar{font-size:var(--fs-s);background:var(--accent-soft);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.draft-bar span{flex:1;min-width:0}
.empty-main{color:var(--muted);font-size:var(--fs-m);padding:56px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-main svg{color:var(--faint)}

/* liked list */
.likes{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.likes li{display:grid;grid-template-columns:minmax(0,1fr) 36px;align-items:start;border-bottom:1px solid var(--line)}
.likes .open{display:flex;flex-direction:column;gap:3px;padding:12px 10px 12px 8px;margin-left:-8px;text-align:left;border-radius:10px;min-width:0}
.likes .open:hover{background:color-mix(in srgb,var(--bubble) 60%,transparent)}
.likes .k-meta{font-size:var(--fs-xs);color:var(--faint);display:flex;gap:10px;align-items:center}
.likes .k-title{font-size:var(--fs-m);font-weight:600}
.likes .k-en{font-family:var(--serif);font-size:var(--fs-l);color:var(--muted);font-style:italic;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.likes .k-words{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.likes .k-words span{font-family:var(--serif);font-size:var(--fs-s);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--fg);background:var(--card)}
.likes .heart{margin-top:10px}

/* skeleton */
.sk{display:flex;flex-direction:column;gap:12px;padding-top:24px}
.sk i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--bubble) 30%,var(--line) 50%,var(--bubble) 70%);background-size:300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}

/* popover, toast, keys */
.pop{position:fixed;z-index:30;width:max-content;max-width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px var(--shadow);padding:10px 10px 8px 12px;font-size:var(--fs-s);animation:rise .16s var(--ease)}
.pop .p-w{display:flex;align-items:center;gap:6px}
.pop .p-w b{font-family:var(--serif);font-size:var(--fs-l);font-weight:600;margin-right:auto;padding-right:8px}
.pop .p-m{margin:2px 0 0}
.pop .p-n{margin:3px 0 0;color:var(--muted);font-size:var(--fs-xs)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);opacity:0;background:var(--fg);color:var(--bg);font-size:var(--fs-s);padding:6px 14px;border-radius:999px;transition:opacity .2s,transform .2s var(--ease);pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.keys{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.keys-in{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px var(--shadow);padding:16px 20px;min-width:260px;animation:rise .18s var(--ease)}
.keys-in h4{margin:0 0 8px;font-size:var(--fs-s);font-weight:600}
.keys-in dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:var(--fs-s);align-items:center}
.keys-in dt{display:flex;gap:3px}
.keys-in dd{margin:0;color:var(--muted)}

/* cover (Esc) */
.cover{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;justify-content:center;padding:calc(46px + env(safe-area-inset-top,0px)) 24px 24px}
.cover-in{width:100%;max-width:720px;display:flex;flex-direction:column;gap:10px}
.cover-h{font-size:var(--fs-s);color:var(--muted);margin:0}
.cover textarea{flex:1;width:100%;border:0;outline:0;background:transparent;resize:none;font-size:var(--fs-m);line-height:1.8}

.scrim{display:none}
@media (max-width: 820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .24s var(--ease);padding-top:env(safe-area-inset-top,0px);box-shadow:0 0 40px var(--shadow)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39}
  .scrim.open{display:block}
  .only-mobile{display:grid}
  .thread{padding-inline:16px}
  .composer{padding-inline:12px}
  .topbar{padding-left:8px}
  .search kbd,#keysBtn{display:none}
  .pager{grid-template-columns:1fr}
  .pager .next{grid-column:1}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

html.static .ai-only{display:none!important}

<body>
<div class="app">

<div class="pop" id="pop" role="dialog" aria-label="単語の意味" hidden></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mixHtml = s => esc(s).replace(/\{([^}]+)\}/g, '<span class="mw">$1</span>');
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('dn_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('dn_' + k, JSON.stringify(v)); }catch(e){} }
};
const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const jstToday = () => jstNow().toISOString().slice(0, 10);
const jstStamp = () => jstNow().toISOString().slice(0, 16);
const dayDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 864e5);
const jpDate = d => { if(!d) return ''; const [, m, dd] = d.slice(0, 10).split('-'); return `${+m}月${+dd}日`; };
const typing = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
const CAT = {anime:'アニメ', movie:'映画', manga:'漫画', own:'自分で追加'};
const LEVEL = {1:'やさしい', 2:'ふつう', 3:'ちょっとむずかしい'};
const SERIES = {haikyu:'ハイキュー!!', medalist:'メダリスト'};
const HEART = '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>';
const ICON = {
  say:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>',
  star:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3.5 2.6 5.3 5.8.9-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.9z"/></svg>',
  heart:`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">${HEART}</svg>`,
  heartS:`<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">${HEART}</svg>`,
  heartL:`<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">${HEART}</svg>`,
  play:'<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  send:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  left:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  ok:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  ng:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>'
};

/* ---------- state ---------- */
const S = {
  lessons: [], byId: {}, cur: null, view: 'lesson', filter: 'all', query: '',
  amount: LS.get('amount', 1), rate: LS.get('rate', 0.8), compMode: 'ask',
  chats: {}, flips: {}, quiz: {},
  state: {saved: [], done: {}, likes: {}}, stateRef: null,
  db: null, sample: null, loaded: false, busy: false, ctl: null, seq: null
};
const normState = d => ({
  saved: Array.isArray(d && d.saved) ? d.saved.slice() : [],
  done: Object.assign({}, d && d.done || {}),
  likes: Object.assign({}, d && d.likes || {})
});

/* ---------- speech ---------- */
let voice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
  const pref = [/natural/i, /google us english/i, /samantha/i, /aria|jenny|guy/i, /en-us/i];
  for(const p of pref){ const v = vs.find(v => p.test(v.name) || p.test(v.lang)); if(v){ voice = v; return; } }
  voice = vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speakToken = 0, speakTimer = 0;
function speak(text, opt = {}){
  if(!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel(); clearTimeout(speakTimer);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = S.rate; if(voice) u.voice = voice;
  if(opt.onend){ u.onend = opt.onend; u.onerror = opt.onend; }
  if(opt.onword) u.onboundary = e => { if(!e.name || e.name === 'word') opt.onword(e.charIndex); };
  speakTimer = setTimeout(() => speechSynthesis.speak(u), 60);
}
function clearSpeakMarks(){ $$('.story li.speaking').forEach(li => li.classList.remove('speaking')); $$('.tk.now').forEach(t => t.classList.remove('now')); }
function stopSpeak(){
  speakToken++; clearTimeout(speakTimer);
  if('speechSynthesis' in window) speechSynthesis.cancel();
  clearSpeakMarks();
  const b = $('[data-act="playall"]'); if(b){ b.dataset.on = ''; b.innerHTML = ICON.play + ' 通して読む'; }
}
function markWord(li, ci){
  if(!li) return;
  li.querySelectorAll('.tk.now').forEach(t => t.classList.remove('now'));
  const t = [...li.querySelectorAll('.tk')].find(t => +t.dataset.s <= ci && ci < +t.dataset.e);
  if(t) t.classList.add('now');
}
function speakLine(i, onend){
  const L = S.byId[S.cur]; if(!L || !L.lines[i]) return;
  const li = $(`#story li[data-i="${i}"]`);
  clearSpeakMarks(); if(li) li.classList.add('speaking');
  speak(L.lines[i].en, {onword: ci => markWord(li, ci), onend: () => { if(li){ li.classList.remove('speaking'); li.querySelectorAll('.tk.now').forEach(t => t.classList.remove('now')); } if(onend) onend(); }});
}
function playAll(){
  const L = S.byId[S.cur]; if(!L) return;
  const btn = $('[data-act="playall"]');
  if(btn && btn.dataset.on === '1'){ stopSpeak(); return; }
  stopSpeak(); const tok = ++speakToken;
  if(btn){ btn.dataset.on = '1'; btn.innerHTML = ICON.stop + ' 止める'; }
  let i = 0;
  const next = () => {
    if(tok !== speakToken) return;
    if(i >= L.lines.length){ stopSpeak(); return; }
    const li = $(`#story li[data-i="${i}"]`); if(li) li.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    speakLine(i, () => { if(tok !== speakToken) return; i++; setTimeout(next, 260); });
  };
  next();
}

/* ---------- English tokens & key words ---------- */
function tokenize(s){
  const out = []; const re = /[A-Za-z0-9][A-Za-z0-9'’-]*/g; let m, last = 0;
  while((m = re.exec(s))){
    if(m.index > last) out.push({t: s.slice(last, m.index)});
    out.push({t: m[0], s: m.index, e: m.index + m[0].length, w: true});
    last = re.lastIndex;
  }
  if(last < s.length) out.push({t: s.slice(last)});
  return out;
}
const norm = x => String(x).toLowerCase().replace(/’/g, "'").replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
function forms(p){
  const f = new Set([p, p + 's', p + 'es', p + 'ed', p + 'd', p + 'ing', p + "'s"]);
  if(p.endsWith('e')) f.add(p.slice(0, -1) + 'ing');
  if(p.endsWith('y')){ f.add(p.slice(0, -1) + 'ies'); f.add(p.slice(0, -1) + 'ied'); }
  return f;
}
function markVocab(L, toks){
  const marks = {};
  const ws = toks.map((t, k) => t.w ? {k, v: norm(t.t)} : null).filter(Boolean);
  (L.words || []).forEach((wd, wi) => {
    const parts = norm(String(wd.w).replace(/~|\.\.\.|…/g, ' ')).split(' ').filter(Boolean);
    const tryMatch = ps => {
      if(!ps.length) return false;
      for(let a = 0; a + ps.length <= ws.length; a++){
        if(ps.every((p, b) => forms(p).has(ws[a + b].v))){
          ps.forEach((_, b) => { if(marks[ws[a + b].k] == null) marks[ws[a + b].k] = wi; });
          return true;
        }
      }
      return false;
    };
    if(!tryMatch(parts) && parts[0] === 'be') tryMatch(parts.slice(1));
  });
  return marks;
}
function enHtml(L, i){
  const toks = tokenize(L.lines[i].en); const marks = markVocab(L, toks);
  return toks.map((t, k) => {
    if(!t.w) return esc(t.t);
    const wi = marks[k];
    return wi != null
      ? `<span class="tk kw" data-s="${t.s}" data-e="${t.e}" data-wi="${wi}" role="button" tabindex="0">${esc(t.t)}</span>`
      : `<span class="tk" data-s="${t.s}" data-e="${t.e}">${esc(t.t)}</span>`;
  }).join('');
}

/* ---------- list / sidebar ---------- */
function groupOf(d){
  const diff = dayDiff(jstToday(), (d || '').slice(0, 10));
  if(isNaN(diff)) return 'それ以前';
  if(diff <= 0) return '今日';
  if(diff === 1) return '昨日';
  if(diff < 7) return '7日以内';
  if(diff < 30) return '30日以内';
  const [y, m] = d.split('-'); return `${y}年${+m}月`;
}
function haystack(L){
  if(!L._hay) L._hay = [L.title, L.summary, ...(L.lines || []).map(l => l.en + ' ' + l.ja), ...(L.words || []).map(w => w.w + ' ' + w.ja), SERIES[L.series] || ''].join(' ').toLowerCase();
  return L._hay;
}
function visible(){
  const f = S.filter, q = S.query.trim().toLowerCase();
  return S.lessons.filter(L => (f === 'all' || (f.startsWith('s:') ? L.series === f.slice(2) : f === 'own' ? L.own : (L.cat === f && !L.own)))
    && (!q || q.split(/\s+/).every(w => haystack(L).includes(w))));
}
function hilite(text){
  const q = S.query.trim(); if(!q) return esc(text);
  let h = esc(text);
  q.split(/\s+/).filter(Boolean).forEach(w => { const r = new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); h = h.replace(r, m => `<mark>${m}</mark>`); });
  return h;
}
function renderList(){
  const box = $('#list');
  if(!S.loaded) return;
  const items = visible();
  if(!items.length){

function quizHtml(L){
  const qz = S.quiz[L.id] || (S.quiz[L.id] = {});
  const qs = (L.quiz || []).map((q, qi) => {
    const ans = qz[qi];
    const choices = (q.choices || []).map((c, ci) => {
      let cls = 'choice', mark = '';
      if(ans != null){
        if(ci === q.a){ cls += ' right'; mark = ICON.ok; }
        else if(ci === ans){ cls += ' wrong'; mark = ICON.ng; }
        else cls += ' dim';
      }
      return `<button class="${cls}" data-q="${qi}" data-c="${ci}" ${ans != null ? 'disabled' : ''}>${mark}${esc(c)}</button>`;
    }).join('');
    const why = ans != null ? `<p class="q-why">${ans === q.a ? '正解。' : 'ざんねん。'}${esc(q.why || '')}</p>` : '';
    return `<div class="qq" data-qq="${qi}"><p class="q-t"><span class="q-n">${qi + 1}</span>${esc(q.q)}</p><div class="choices">${choices}</div>${why}</div>`;
  }).join('');
  return qs + resultHtml(L);
}
function resultHtml(L){
  const qz = S.quiz[L.id] || {}; const n = (L.quiz || []).length;
  if(!n || Object.keys(qz).length < n) return '';
  const s = L.quiz.filter((q, i) => qz[i] === q.a).length;
  const msg = s === n ? 'ぜんぶ正解です。' : s === 0 ? 'もう一度読んでから、ためしてみましょう。' : 'あと少しです。';
  return `<div class="q-res" id="qres"><span class="dots">${L.quiz.map((q, i) => `<i class="${qz[i] === q.a ? 'r' : 'w'}"></i>`).join('')}</span><span><b>${n}問中${s}問</b>正解。${msg}</span><button class="txt-btn" data-act="retry">もう一度</button></div>`;
}
function scoreText(L){
  const qz = S.quiz[L.id] || {}; const n = (L.quiz || []).length;

}

function answer(qi, ci){
  const L = S.byId[S.cur]; if(!L) return;
  const qz = S.quiz[L.id] || (S.quiz[L.id] = {});
  if(qz[qi] != null) return;
  qz[qi] = ci;
  const q = L.quiz[qi];
  const wrap = $(`.qq[data-qq="${qi}"]`);
  wrap.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if(i === q.a){ b.classList.add('right'); b.insertAdjacentHTML('afterbegin', ICON.ok); if(i === ci) b.classList.add('picked'); }
    else if(i === ci){ b.classList.add('wrong'); b.insertAdjacentHTML('afterbegin', ICON.ng); }
    else b.classList.add('dim');
  });
  wrap.insertAdjacentHTML('beforeend', `<p class="q-why">${ci === q.a ? '正解。' : 'ざんねん。'}${esc(q.why || '')}</p>`);
  const n = L.quiz.length;
  if(Object.keys(qz).length === n){
    $('#quiz').insertAdjacentHTML('beforeend', resultHtml(L));
    if(L.id !== '__draft'){
      const s = L.quiz.filter((q, i) => qz[i] === q.a).length;
      S.state.done[L.id] = {s, n, at: jstToday()};
      saveState(); renderList();
    }
  }
  $('#score').textContent = scoreText(L);
}

let writing = false, again = false;
async function saveState(){
  const snap = JSON.parse(JSON.stringify(S.state));
  if(!S.stateRef){ LS.set('state', snap); return; }
  if(writing){ again = true; return; }
  writing = true;
  try{ await S.stateRef.set(snap); }catch(e){ LS.set('state', snap); }
  writing = false;
  if(again){ again = false; saveState(); }
}
function toggleWord(w, from){
  const i = S.state.saved.findIndex(s => s.w === w);
  if(i >= 0) S.state.saved.splice(i, 1);
  else {
    const L = S.byId[from] || S.byId[S.cur];
    const wd = L && (L.words || []).find(x => x.w === w);
    S.state.saved.unshift({w, ja: wd ? wd.ja : '', note: wd && wd.note ? wd.note : '', from: L && L.id !== '__draft' ? L.id : ''});
  }
  saveState(); renderCounts(); refreshStars();

ルール:
- 英文は中学で習う単語と文法だけを使い、1文はだいたい12語以内。固有名詞はそのままでよい。

function mdHtml(t){
  const lines = esc(t).split('\n'); let out = '', inList = false;

    const b = ln.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    if(/^\s*[-・]\s+/.test(ln)){ if(!inList){ out += '<ul>'; inList = true; } out += '<li>' + b.replace(/^\s*[-・]\s+/, '') + '</li>'; }
    else { if(inList){ out += '</ul>'; inList = false; } if(ln.trim()) out += '<p>' + b + '</p>'; }

}

    if(/^(直すなら|英語では)[:：]/.test(s)) return `<p class="fix">${esc(s)}</p>`;
    en.push(s.replace(/\*\*/g, '')); return `<p>${esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')}</p>`;

    // public copy: lessons come from lessons.js, progress stays in this browser
    document.documentElement.classList.add('static');
    S.loaded = true;
    S.lessons = window.LESSONS.filter(L => L && Array.isArray(L.lines) && L.lines.length).slice().sort((a, b) => a.added < b.added ? 1 : -1);
    S.lessons.forEach(L => { S.byId[L.id] = L; });
    renderList(); renderCounts(); openInitial();
    return;
  }
  setCompNote();
  if(!db){
    S.loaded = true;
    $('#list').innerHTML = '<p class="empty-side">話題を読み込めませんでした。claude.ai にログインした状態で開いてください。</p>';
    $('#thread').innerHTML = emptyMain('話題を読み込めませんでした。');
    return;
  }
  const uid = user ? await user.id().catch(() => null) : null;
  if(uid){
    try{
      S.stateRef = db.doc('data/users/' + uid + '/state');
      S.stateRef.onSnapshot(s => {
        if(s.exists) S.state = normState(s.data() || {});
        else {
          const local = normState(LS.get('state', null));
          if(local.saved.length || Object.keys(local.done).length || Object.keys(local.likes).length){ S.state = local; saveState(); }
        }
        renderCounts(); refreshStars(); renderList();
        if(S.view === 'words') renderWords(true);
        else if(S.view === 'likes') renderLikes(true);
        else if(S.view === 'lesson' && S.byId[S.cur]){ syncLikeBtn(); const sc = $('#score'); if(sc) sc.textContent = scoreText(S.byId[S.cur]); }
      }, () => { S.stateRef = null; });
    }catch(e){ S.stateRef = null; }
  }
  db.collection('lessons').orderBy('added', 'desc').limit(500).onSnapshot(snap => {
    S.lessons = snap.docs.map(d => Object.assign({}, d.data(), {id: d.id})).filter(L => Array.isArray(L.lines) && L.lines.length);
    const draft = S.byId.__draft;
    S.byId = {}; S.lessons.forEach(L => { S.byId[L.id] = L; });
    if(draft) S.byId.__draft = draft;
    const first = !S.loaded; S.loaded = true;
    renderList(); renderCounts(); setCompNote();
    if(first) openInitial();
    else if(S.view === 'lesson' && !S.byId[S.cur]){ const f = S.lessons[0]; if(f) openLesson(f.id); else renderNew(); }
  }, () => {
    S.loaded = true;
    $('#list').innerHTML = '<p class="empty-side">話題を読み込めませんでした。ページを開きなおしてください。</p>';
  });
})();
})();
</script>
</body>
</html>
