/* ---------- public copy: share likes etc. across devices via a private GitHub repo ---------- */
const Sync = (() => {
  const REPO = 'nakadaayane/daily-notes-data', PATH = 'state.json', API = `https://api.github.com/repos/${REPO}/contents/${PATH}`;
  let token = LS.get('ghtoken', ''), sha = null, timer = 0, busy = false, again = false;
  const st = {state: token ? 'idle' : 'off', last: LS.get('ghlast', ''), err: ''};
  const b64e = s => btoa(unescape(encodeURIComponent(s)));
  const b64d = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ''))));
  const hdr = () => ({Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'});
  async function get(){
    const r = await fetch(API + '?ref=main&_=' + Date.now(), {headers: hdr(), cache: 'no-store'});
    if(r.status === 404) return {data: null, sha: null};
    if(!r.ok) throw {status: r.status};
    const j = await r.json(); return {data: JSON.parse(b64d(j.content)), sha: j.sha};
  }
  async function put(data){
    const r = await fetch(API, {method: 'PUT', headers: hdr(), body: JSON.stringify({message: 'sync ' + jstStamp(), content: b64e(JSON.stringify(data, null, 1)), branch: 'main', ...(sha ? {sha} : {})})});
    if(r.status === 409 || r.status === 422) throw {conflict: true};
    if(!r.ok) throw {status: r.status};
    sha = (await r.json()).content.sha;
  }
  const latest = (...v) => v.filter(Boolean).sort().pop() || '';
  function merge(a, b){
    const o = normState({});
    const onOff = (ON, OFF) => new Set([...Object.keys(a[ON]), ...Object.keys(b[ON]), ...Object.keys(a[OFF]), ...Object.keys(b[OFF])]).forEach(id => {
      const on = latest(a[ON][id], b[ON][id]), off = latest(a[OFF][id], b[OFF][id]);
      if(on && on >= off) o[ON][id] = on; else if(off) o[OFF][id] = off;
    });
    onOff('likes', 'likesOff'); onOff('sents', 'sentsOff');
    const words = {};
    [...b.saved, ...a.saved].forEach(w => { const c = words[w.w]; if(!c || (w.t || 0) > (c.t || 0)) words[w.w] = w; });
    const offW = {};
    [a.savedOff, b.savedOff].forEach(m => Object.entries(m).forEach(([w, t]) => { offW[w] = Math.max(offW[w] || 0, +t || 0); }));
    o.saved = Object.values(words).filter(w => !(offW[w.w] && offW[w.w] >= (w.t || 0))).sort((x, y) => (y.t || 0) - (x.t || 0));
    Object.entries(offW).forEach(([w, t]) => { if(!words[w] || t >= (words[w].t || 0)) o.savedOff[w] = t; });
    [b.done, a.done].forEach(m => Object.entries(m).forEach(([id, v]) => { const c = o.done[id]; if(!c || (v && v.at || '') >= (c.at || '')) o.done[id] = v; }));
    o.seen = Object.assign({}, b.seen, a.seen);
    o.days = [...new Set([...a.days, ...b.days])].sort().slice(-400);
    return canon(o);
  }
  const sortObj = m => Object.fromEntries(Object.keys(m).sort().map(k => [k, m[k]]));
  function canon(x){
    const o = normState(x);
    ['likes', 'likesOff', 'savedOff', 'done', 'seen', 'sents', 'sentsOff'].forEach(k => { o[k] = sortObj(o[k]); });
    o.saved = o.saved.slice().sort((p, q) => (q.t || 0) - (p.t || 0) || (p.w < q.w ? -1 : p.w > q.w ? 1 : 0));
    o.days = [...new Set(o.days)].sort();
    return o;
  }
  const same = (x, y) => JSON.stringify(canon(x)) === JSON.stringify(canon(y));
  function repaint(){
    renderCounts(); refreshStars(); renderList();
    if(S.view === 'words') renderWords(true);
    else if(S.view === 'likes') renderLikes(true);
    else if(S.view === 'lesson' && S.byId[S.cur]){ syncLikeBtn(); syncSentHearts(); const sc = $('#score'); if(sc) sc.textContent = scoreText(S.byId[S.cur]); }
  }
  async function run(tries = 0){
    if(!token || !document.documentElement.classList.contains('static')) return;
    if(busy){ again = true; return; }
    busy = true; st.state = 'busy'; paint();
    try{
      const remote = await get(); sha = remote.sha;
      const r = normState(remote.data || {});
      const merged = merge(normState(S.state), r);
      if(!same(merged, normState(S.state))){ S.state = merged; LS.set('state', merged); repaint(); }
      if(!remote.data || !same(merged, r)) await put(merged);
      st.state = 'ok'; st.err = ''; st.last = jstStamp(); LS.set('ghlast', st.last);
    }catch(e){
      if(e && e.conflict && tries < 2){ busy = false; return run(tries + 1); }
      st.state = 'err';
      st.err = e && (e.status === 401 || e.status === 403) ? '合言葉が正しくないか、期限が切れています。' : e && e.status === 404 ? 'データ置き場が見つかりません（合言葉の対象リポジトリを確認してください）。' : 'つながりませんでした。あとでもう一度ためします。';
    }finally{
      busy = false; paint();
      if(again){ again = false; run(); }
    }
  }
  function schedule(){ if(!token) return; clearTimeout(timer); timer = setTimeout(run, 1500); }
  function paint(){
    const b = $('#syncBtn'); if(!b) return;
    b.dataset.s = st.state;
    b.title = st.state === 'off' ? 'ほかの端末と同期する' : st.state === 'err' ? '同期できませんでした' : st.state === 'busy' ? '同期中' : `同期ずみ（${st.last ? jpDate(st.last) + ' ' + st.last.slice(11, 16) : ''}）`;
    const p = $('#syncPanel'); if(p && !p.hidden) renderPanel();
  }
  function renderPanel(){
    const p = $('#syncPanel'); const on = !!token;
    p.querySelector('.sync-in').innerHTML = `<h4>ほかの端末と同期</h4>
      <p class="sync-p">いいね・単語帳・クイズの結果を、ほかのスマホやパソコンと共有します。同じ合言葉を、使う端末それぞれで一度だけ入れてください（この端末のブラウザに保存されます）。</p>
      ${on ? `<p class="sync-st" data-s="${st.state}">${st.state === 'err' ? esc(st.err) : st.state === 'busy' ? '同期しています…' : `同期ずみ${st.last ? '：' + esc(jpDate(st.last)) + ' ' + esc(st.last.slice(11, 16)) : ''}`}</p>
        <div class="row"><button class="btn" id="syncNow">いま同期する</button><button class="btn ghost" id="syncOff">この端末の同期をやめる</button></div>`
      : `<input class="field" id="syncToken" type="password" autocomplete="off" spellcheck="false" placeholder="合言葉（github_pat_ ではじまる文字）">
        <div class="row"><button class="btn" id="syncOn">つなぐ</button><span class="note" id="syncMsg"></span></div>`}
      <div class="row"><button class="txt-btn" id="syncClose">閉じる</button></div>`;
  }
  function open(){ const p = $('#syncPanel'); p.hidden = false; renderPanel(); const t = $('#syncToken'); if(t) t.focus(); }
  function close(){ $('#syncPanel').hidden = true; }
  async function connect(val){
    val = String(val || '').trim(); const msg = $('#syncMsg');
    if(!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(val)){ if(msg) msg.textContent = '合言葉の形がちがいます。'; return; }
    token = val; if(msg) msg.textContent = 'たしかめています…';
    try{ await get(); }catch(e){ token = ''; if(msg) msg.textContent = e && (e.status === 401 || e.status === 403) ? '合言葉が正しくないか、権限が足りません。' : e && e.status === 404 ? 'データ置き場が見つかりません。リポジトリの選び方を確認してください。' : 'つながりませんでした。'; return; }
    LS.set('ghtoken', token); st.state = 'idle'; renderPanel(); await run(); toast('ほかの端末と同期するようにしました');
  }
  function disconnect(){ token = ''; sha = null; LS.set('ghtoken', ''); st.state = 'off'; renderPanel(); paint(); toast('この端末の同期をやめました'); }
  function init(){
    document.body.insertAdjacentHTML('beforeend', '<div class="keys" id="syncPanel" hidden><div class="keys-in sync-in" role="dialog" aria-label="ほかの端末と同期"></div></div>');
    const foot = $('.side-foot .sp');
    foot.insertAdjacentHTML('afterend', `<button class="foot-btn static-only" id="syncBtn" aria-label="ほかの端末と同期"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8"/><path d="M12 12v7M9.5 16.5 12 19l2.5-2.5"/></svg><i class="sync-dot"></i></button>`);
    $('#syncBtn').addEventListener('click', open);
    $('#syncPanel').addEventListener('click', e => {
      if(e.target.id === 'syncPanel' || e.target.id === 'syncClose') close();
      else if(e.target.id === 'syncOn') connect($('#syncToken').value);
      else if(e.target.id === 'syncNow') run();
      else if(e.target.id === 'syncOff') disconnect();
    });
    $('#syncPanel').addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'syncToken') connect(e.target.value); });
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') run(); });
    paint();
  }
  return {init, run, schedule, merge};
})();

/* ---------- boot ---------- */
function openInitial(){
  const hash = decodeURIComponent((location.hash || '').slice(1));
  if(hash === 'dict'){ renderDict(); return; }
  if(hash === 'flow'){ renderFlow(); return; }
  const last = LS.get('last', '');
  const want = S.byId[hash] ? hash : (S.byId[last] ? last : (S.lessons[0] && S.lessons[0].id));
  if(want) openLesson(want); else if(S.sample) renderNew(); else { $('#thread').innerHTML = emptyMain('まだ話題がありません。'); }
}
S.state = normState(LS.get('state', null));
renderCounts();
setCompMode('ask');

(async () => {
  const [db, user, sample] = await Promise.all([use('db'), use('user'), use('sample')]);
  S.sample = typeof sample === 'function' ? sample : null;
  S.db = db;
  if(!db && Array.isArray(window.LESSONS)){
    // public copy: lessons come from lessons.js, progress stays in this browser
    document.documentElement.classList.add('static');
    S.loaded = true;
    S.lessons = window.LESSONS.filter(L => L && Array.isArray(L.lines) && L.lines.length).slice().sort(byArrival);
    S.lessons.forEach(L => { S.byId[L.id] = L; });
    renderList(); renderCounts(); openInitial();
    Sync.init(); Sync.run();
    return;
  }
  setCompNote();
  if(!db){
    S.loaded = true;
    $('#list').innerHTML = '<p class="empty-side">話題を読み込めませんでした。claude.ai にログインした状態で開いてください。</p>';
    $('#thread').innerHTML = emptyMain('話題を読み込めませんでした。');
    return;
  }
  const uid = user ? await user.id().catch(() => null) : null;
  S.uid = uid;
  if(uid && S.view === 'lesson' && S.cur) syncChat(S.cur);
  if(uid){
    try{
      S.stateRef = db.doc('data/users/' + uid + '/state');
      S.stateRef.onSnapshot(s => {
        const firstState = !S.stateReady; S.stateReady = true;
        if(s.exists) S.state = normState(s.data() || {});
        else {
          const local = normState(LS.get('state', null));
          if(local.saved.length || Object.keys(local.done).length || Object.keys(local.likes).length){ S.state = local; saveState(); }
        }
        renderCounts(); refreshStars(); renderList();
        if(S.view === 'words') renderWords(true);
        else if(S.view === 'review') {}
        if(firstState && S.view === 'lesson') markVisit(S.cur);
        else if(S.view === 'likes') renderLikes(true);
        else if(S.view === 'lesson' && S.byId[S.cur]){ syncLikeBtn(); syncSentHearts(); const sc = $('#score'); if(sc) sc.textContent = scoreText(S.byId[S.cur]); }
      }, () => { S.stateRef = null; S.stateReady = true; });
    }catch(e){ S.stateRef = null; }
  }
  db.collection('lessons').orderBy('added', 'desc').limit(500).onSnapshot(snap => {
    S.lessons = snap.docs.map(d => Object.assign({}, d.data(), {id: d.id})).filter(L => Array.isArray(L.lines) && L.lines.length).sort(byArrival);
    const draft = S.byId.__draft;
    S.byId = {}; S.lessons.forEach(L => { S.byId[L.id] = L; });
    if(draft) S.byId.__draft = draft;
    const first = !S.loaded; S.loaded = true;
    renderList(); renderCounts(); setCompNote();
    if(first) openInitial();
    if(first && S.uid && S.cur) syncChat(S.cur);
    else if(S.view === 'lesson' && !S.byId[S.cur]){ const f = S.lessons[0]; if(f) openLesson(f.id); else renderNew(); }
  }, () => {
    S.loaded = true;
    $('#list').innerHTML = '<p class="empty-side">話題を読み込めませんでした。ページを開きなおしてください。</p>';
  });
})();
})();
</script>
