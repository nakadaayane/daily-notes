<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>English Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: chat-app shell. Left = history of topics (search, likes, word book), right = one topic read like a conversation, composer pinned at the bottom. */
:root{
  --bg:#f9f8f4; --side:#f1efe8; --card:#fffefb; --fg:#2e2c28; --muted:#77736b; --faint:#a7a299;
  --line:#e3dfd5; --bubble:#ece9e1; --accent:#a3624a; --accent-soft:#f2e5de; --hl:#f3ead4;
  --good:#3d7650; --good-soft:#e1eee4; --bad:#a24d3c; --bad-soft:#f5e2dd;
  --dot-movie:#7f90a5; --dot-anime:#7e9b7d; --dot-manga:#b48a6c; --dot-own:#9a8fb0;
  --shadow:rgba(46,38,30,.10);
  --serif:"Source Serif 4", Georgia, "Times New Roman", "Yu Gothic UI", "Hiragino Sans", Meiryo, serif;
  --ui:system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  --fs-xs:.71875rem; --fs-s:.75rem; --fs-m:.84375rem; --fs-l:.9375rem; --fs-xl:1.0625rem;
  --ease:cubic-bezier(.2,.7,.2,1); --quick:.14s;
  --icon:color-mix(in srgb, var(--muted) 72%, var(--faint));   /* アイコンの色（読みやすさのため faint より少し濃い。テーマに追従） */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#262523; --side:#1d1c1a; --card:#2c2a27; --fg:#ebe8e1; --muted:#a29e95; --faint:#76726a;
    --line:#393733; --bubble:#34322e; --accent:#d58c6f; --accent-soft:#3c2b24; --hl:#3a3323;
    --good:#86c497; --good-soft:#233128; --bad:#e3907c; --bad-soft:#3a2521;
    --dot-movie:#8ea0b6; --dot-anime:#8fae8d; --dot-manga:#c79c7d; --dot-own:#ab9fc4;
    --shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#262523; --side:#1d1c1a; --card:#2c2a27; --fg:#ebe8e1; --muted:#a29e95; --faint:#76726a;
  --line:#393733; --bubble:#34322e; --accent:#d58c6f; --accent-soft:#3c2b24; --hl:#3a3323;
  --good:#86c497; --good-soft:#233128; --bad:#e3907c; --bad-soft:#3a2521;
  --dot-movie:#8ea0b6; --dot-anime:#8fae8d; --dot-manga:#c79c7d; --dot-own:#ab9fc4;
  --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:var(--fs-m);line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden;line-break:strict;word-break:auto-phrase;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;transition:background-color var(--quick),color var(--quick),border-color var(--quick),transform .12s var(--ease),opacity var(--quick)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--hl)}
svg{display:block;flex:none}
.list,.scroll{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
kbd{font-family:var(--ui);font-size:.625rem;line-height:1;color:var(--faint);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 4px;background:var(--card)}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px 18px}
.brand{font-family:var(--serif);font-size:var(--fs-l);letter-spacing:.01em}
.search{position:relative;margin:2px 10px 6px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--icon);pointer-events:none}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 30px 5px 28px;font-size:var(--fs-s);outline:0;transition:border-color var(--quick)}
.search input:focus{border-color:var(--faint)}
.search input::placeholder{color:var(--faint)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.search input:focus ~ kbd,.search input:not(:placeholder-shown) ~ kbd{display:none}
.side-actions{display:flex;flex-direction:column;gap:1px;padding:2px 8px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border-radius:8px;font-size:var(--fs-s);text-align:left;color:var(--fg)}
.nav-btn svg{color:var(--muted)}
.nav-btn:hover,.nav-btn[aria-current="true"]{background:var(--bubble)}
.nav-btn .cnt{margin-left:auto;color:var(--muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:3px;padding:6px 12px 4px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.filters::-webkit-scrollbar{display:none}
.filters.end{-webkit-mask-image:none;mask-image:none}
.chip{flex:none;font-size:var(--fs-xs);padding:1px 9px;border-radius:999px;color:var(--muted);border:1px solid transparent}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--line);background:var(--card);color:var(--fg)}
.list{flex:1;overflow-y:auto;padding:2px 8px 14px;min-height:0}
.grp{font-size:var(--fs-xs);color:var(--muted);padding:14px 10px 3px;display:flex;justify-content:space-between}
.item{scroll-margin:30px 0 8px;display:flex;align-items:center;gap:8px;width:100%;padding:5px 10px;border-radius:8px;font-size:var(--fs-s);text-align:left;color:var(--fg)}
.item:hover,.item[aria-current="true"]{background:var(--bubble)}
.item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item mark{background:var(--hl);color:inherit;border-radius:2px}
.item .marks{display:flex;align-items:center;gap:4px;color:var(--icon);font-size:var(--fs-xs)}
.item .marks .lk{color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--faint)}
.dot.movie{background:var(--dot-movie)}.dot.anime{background:var(--dot-anime)}.dot.manga{background:var(--dot-manga)}.dot.own{background:var(--dot-own)}
.side-foot{border-top:1px solid var(--line);padding:9px 14px 11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted)}
.side-foot .sp{flex:1}
.voice-sel{font:inherit;font-size:var(--fs-xs);color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px;max-width:150px;min-width:0}
.foot-btn{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:var(--fs-xs);padding:2px 4px;border-radius:5px}
.foot-btn:hover{color:var(--fg);background:var(--bubble)}
.empty-side{color:var(--muted);font-size:var(--fs-s);padding:12px 10px;line-height:1.7}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.topbar{display:flex;align-items:center;gap:4px;height:46px;padding:0 10px 0 18px;flex:none;position:relative}
.topbar::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:calc(var(--p,0) * 100%);background:var(--accent);opacity:.55;transition:width .1s linear}
.top-title{flex:1;min-width:0;font-size:var(--fs-s);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--bubble);color:var(--fg)}
.only-mobile{display:none}
.scroll{flex:1;overflow-y:auto;min-height:0}
.thread{max-width:720px;margin:0 auto;padding-block:6px 48px;padding-inline:24px;display:flex;flex-direction:column;gap:22px}
.thread.enter > *{animation:rise .34s var(--ease) both}
.thread.enter > *:nth-child(2){animation-delay:.04s}
.thread.enter > *:nth-child(3){animation-delay:.08s}
.thread.enter > *:nth-child(n+4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* heart (like) */
.heart[aria-pressed="true"]{color:var(--accent)}
.heart[aria-pressed="true"] svg path{fill:currentColor}
.heart.pop svg{animation:pop .44s var(--ease)}
.heart.pop::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px solid var(--accent);animation:ring .55s var(--ease) forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.3)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes ring{from{transform:scale(.55);opacity:.8}to{transform:scale(1.45);opacity:0}}

/* user bubble */
.u-row{display:flex;justify-content:flex-end}
.u-bubble{background:var(--bubble);border-radius:16px;padding:9px 14px;max-width:min(520px,88%);overflow-wrap:anywhere}
.u-bubble .src{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:1px}
.u-bubble a{color:inherit;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}

/* assistant answer */
.a-block{display:flex;flex-direction:column;gap:22px;font-family:var(--serif);font-size:var(--fs-l);line-height:1.7}
.a-block p{margin:0}
.lead{margin:0;text-wrap:pretty}
.meta-line{font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:-12px}
.blk{display:flex;flex-direction:column;gap:9px}
.blk-h{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.blk h2,.blk h3{margin:0;font-family:var(--ui);font-size:var(--fs-m);font-weight:600;letter-spacing:.01em}
.blk-h .sp{flex:1}
.note{font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted);margin:0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card);font-family:var(--ui)}
.seg button{font-size:var(--fs-xs);padding:1px 10px;border-radius:999px;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--bubble);color:var(--fg)}
.txt-btn{font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px}
.txt-btn:hover{color:var(--fg);background:var(--bubble)}
.txt-btn[data-on="1"]{color:var(--accent)}

.story{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.story li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;margin-inline:-8px;border-radius:8px;cursor:pointer;transition:background-color .2s}
.story li:hover{background:color-mix(in srgb,var(--bubble) 55%,transparent)}
.story li.speaking{background:color-mix(in srgb,var(--hl) 55%,transparent)}
.story .s-body{flex:1;min-width:0}
.story .s-body.swap{animation:swap .22s var(--ease)}
@keyframes swap{from{opacity:.15;transform:translateY(2px)}to{opacity:1;transform:none}}
.story .s-text.ja{font-family:var(--ui);font-size:var(--fs-m)}
.story .s-sub{display:block;font-family:var(--ui);font-size:var(--fs-s);color:var(--muted);margin-top:1px}
.story .s-sub.en-sub{font-family:var(--serif);font-size:var(--fs-m)}
.mw{font-family:var(--serif);font-size:1.06em;background:var(--hl);padding:0 3px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mw[data-k]{cursor:pointer;transition:background-color .12s,color .12s}
.mw[data-k]:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.mw.ja{font-family:var(--ui);font-size:1em;background:var(--accent-soft);color:var(--accent)}
.mw.busy{opacity:.55}
.story .tk:not(.kw){cursor:pointer}
.story .tk:not(.kw):hover{background:var(--hl)}
.say.tr{font-family:var(--ui);font-size:var(--fs-xs);font-weight:600}
.pop .p-link{display:inline-block;margin-top:4px;color:var(--muted);font-size:var(--fs-xs)}
.pop .p-busy{color:var(--faint)}
.tk{border-radius:3px;transition:background-color .12s,box-shadow .12s}
.tk.kw{text-decoration:underline dotted;text-decoration-color:var(--faint);text-decoration-thickness:1px;text-underline-offset:4px;cursor:help}
.tk.kw:hover,.tk.kw:focus-visible{color:var(--accent);text-decoration-color:var(--accent);outline:0}
.tk.now{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.say{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--icon)}
.say:hover{color:var(--fg);background:var(--bubble)}

.words{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.words li{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.words .wtxt{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;min-width:0}
.words .w{font-family:var(--serif);font-size:var(--fs-l);font-weight:600}
.words .m{font-family:var(--ui);font-size:var(--fs-m)}
.words .n{font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted);flex-basis:100%;line-height:1.6}
.words .n button{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;font-size:inherit}
.words .n button:hover{color:var(--fg)}
.words.blur .m{filter:blur(5px);cursor:pointer;transition:filter .15s}
.words.blur .m.show{filter:none}
.star{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--icon)}
.star:hover{background:var(--bubble);color:var(--fg)}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg path{fill:currentColor}

.gram{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.gram .g-body{font-family:var(--ui);font-size:var(--fs-m)}
.ex{margin:0}
.ex .ja{display:block;font-family:var(--ui);font-size:var(--fs-s);color:var(--muted)}

.quiz{display:flex;flex-direction:column;gap:16px;font-family:var(--ui);font-size:var(--fs-m)}
.q-t{margin:0 0 6px}
.q-n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;text-align:left;display:inline-flex;align-items:center;gap:6px}
.choice:hover:not(:disabled){border-color:var(--faint)}
.choice:disabled{cursor:default}
.choice.dim{opacity:.55}
.choice.right{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:1}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);opacity:1}
.choice.right.picked{animation:nudge .32s var(--ease)}
.choice.wrong{animation:shake .3s var(--ease)}
@keyframes nudge{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.q-why{margin:6px 0 0;font-size:var(--fs-s);color:var(--muted)}
.q-res{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--fs-s);color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.q-res b{color:var(--fg);font-weight:600}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.r{background:var(--good)}.dots i.w{background:var(--bad)}

.talk-q{font-size:var(--fs-xl);margin:0;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.talk-ja{font-family:var(--ui);font-size:var(--fs-s);color:var(--muted)}
.pill{font-family:var(--ui);font-size:var(--fs-s);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;display:inline-flex;align-items:center;gap:6px;position:relative}
.pill:hover{border-color:var(--faint)}
.pill.heart[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft)}

.end-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--ui);border-top:1px solid var(--line);padding-top:14px}
.src-foot{flex:1;min-width:0;font-size:var(--fs-xs);color:var(--muted)}
.src-foot a{color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:var(--ui)}
.pager button{border:1px solid var(--line);border-radius:12px;padding:9px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.pager button:hover{background:var(--card);border-color:var(--faint)}
.pager .lbl{font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;gap:6px}
.pager .ttl{font-size:var(--fs-s);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pager .next{grid-column:2;text-align:right;align-items:flex-end}
.pager .next .lbl{flex-direction:row-reverse}

/* chat */
.chat{display:flex;flex-direction:column;gap:18px}
.a-msg{font-family:var(--serif);font-size:var(--fs-l);line-height:1.7;display:flex;flex-direction:column;gap:8px}
.a-msg p{margin:0}
.a-msg ul{margin:0;padding-left:1.2em}
.a-msg .tr{font-family:var(--ui);font-size:var(--fs-s);color:var(--muted)}
.a-msg .fix{font-family:var(--ui);font-size:var(--fs-s);background:var(--accent-soft);border-radius:8px;padding:6px 10px}
.a-msg .thinking{font-family:var(--ui);font-size:var(--fs-s);color:var(--faint)}
.a-msg .thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.a-msg .err{font-family:var(--ui);font-size:var(--fs-s);color:var(--bad)}
.a-tools{display:flex;gap:4px}

/* composer */
.composer{flex:none;padding:0 24px calc(14px + env(safe-area-inset-bottom,0px))}
.comp-box{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 12px 7px;box-shadow:0 1px 6px var(--shadow);transition:border-color var(--quick)}
.comp-box:focus-within{border-color:var(--faint)}
.comp-box textarea{width:100%;border:0;outline:0;background:transparent;resize:none;font-size:var(--fs-m);line-height:1.6;max-height:180px;padding:2px 4px}
.comp-row{display:flex;align-items:center;gap:8px;margin-top:3px}
.comp-note{flex:1;min-width:0;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--fg);color:var(--bg)}
.send:disabled{opacity:.35;cursor:default}

/* other views */
.view-head{display:flex;flex-direction:column;gap:4px;margin-top:22px}
.view-h{font-family:var(--serif);font-size:1.25rem;font-weight:400;margin:0;text-wrap:balance;display:flex;align-items:baseline;gap:10px}
.view-h .c{font-family:var(--ui);font-size:var(--fs-s);color:var(--muted);font-variant-numeric:tabular-nums}
.view-p{color:var(--muted);font-size:var(--fs-s);margin:0}
.field{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:var(--fs-m);line-height:1.6;outline:0}
.field:focus{border-color:var(--faint)}
.btn{background:var(--fg);color:var(--bg);border-radius:10px;padding:6px 16px;font-size:var(--fs-s);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--faint)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.draft-bar{font-size:var(--fs-s);background:var(--accent-soft);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.draft-bar span{flex:1;min-width:0}
.empty-main{color:var(--muted);font-size:var(--fs-m);padding:56px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}

/* liked list */
.likes{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.likes li{display:grid;grid-template-columns:minmax(0,1fr) 36px;align-items:start;border-bottom:1px solid var(--line)}
.likes .open{display:flex;flex-direction:column;gap:3px;padding:12px 10px 12px 8px;margin-left:-8px;text-align:left;border-radius:10px;min-width:0}
.likes .open:hover{background:color-mix(in srgb,var(--bubble) 60%,transparent)}
.likes .k-meta{font-size:var(--fs-xs);color:var(--muted);display:flex;gap:10px;align-items:center}
.likes .k-title{font-size:var(--fs-m);font-weight:600}
.likes .k-en{font-family:var(--serif);font-size:var(--fs-l);color:var(--muted);font-style:italic;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.likes .k-words{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.likes .k-words span{font-family:var(--serif);font-size:var(--fs-s);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--fg);background:var(--card)}
.likes .heart{margin-top:10px}

/* skeleton */
.sk{display:flex;flex-direction:column;gap:12px;padding-top:24px}
.sk i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--bubble) 30%,var(--line) 50%,var(--bubble) 70%);background-size:300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}

/* popover, toast, keys */
.pop{position:fixed;z-index:30;width:max-content;max-width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px var(--shadow);padding:10px 10px 8px 12px;font-size:var(--fs-s);animation:rise .16s var(--ease)}
.pop .p-w{display:flex;align-items:center;gap:6px}
.pop .p-w b{font-family:var(--serif);font-size:var(--fs-l);font-weight:600;margin-right:auto;padding-right:8px}
.pop .p-m{margin:2px 0 0}
.pop .p-n{margin:3px 0 0;color:var(--muted);font-size:var(--fs-xs)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);opacity:0;background:var(--fg);color:var(--bg);font-size:var(--fs-s);padding:6px 14px;border-radius:999px;transition:opacity .2s,transform .2s var(--ease);pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.keys{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.keys-in{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px var(--shadow);padding:16px 20px;min-width:260px;animation:rise .18s var(--ease)}
.keys-in h4{margin:0 0 8px;font-size:var(--fs-s);font-weight:600}
.keys-in dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:var(--fs-s);align-items:center}
.keys-in dt{display:flex;gap:3px}
.keys-in dd{margin:0;color:var(--muted)}

/* cover (Esc) */
.cover{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;justify-content:center;padding:calc(46px + env(safe-area-inset-top,0px)) 24px 24px}
.cover-in{width:100%;max-width:720px;display:flex;flex-direction:column;gap:10px}
.cover-h{font-size:var(--fs-s);color:var(--muted);margin:0}
.cover textarea{flex:1;width:100%;border:0;outline:0;background:transparent;resize:none;font-size:var(--fs-m);line-height:1.8}

.scrim{display:none}
@media (max-width: 820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .24s var(--ease);padding-top:env(safe-area-inset-top,0px);box-shadow:0 0 40px var(--shadow)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39}
  .scrim.open{display:block}
  .only-mobile{display:grid}
  .thread{padding-inline:16px}
  .composer{padding-inline:12px}
  .topbar{padding-left:8px}
  .search kbd,#keysBtn{display:none}
  .pager{grid-template-columns:1fr}
  .pager .next{grid-column:1}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
/* English amount slider */
.amt{font-family:var(--ui);display:flex;flex-direction:column;gap:2px;padding:9px 14px 4px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.amt-top{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-xs);color:var(--muted)}
.amt-top b{font-size:var(--fs-s);font-weight:600;color:var(--fg)}
.amt-range{-webkit-appearance:none;appearance:none;display:block;width:100%;height:24px;background:transparent;margin:0;cursor:pointer;--fill:50%}
.amt-range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--fill),var(--line) var(--fill))}
.amt-range::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.amt-range::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.amt-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--card);border:2px solid var(--accent);margin-top:-7px;box-shadow:0 1px 4px var(--shadow)}
.amt-range::-moz-range-thumb{box-sizing:border-box;width:18px;height:18px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.amt-range:focus-visible{outline:0}
.amt-range:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
.amt-ticks{position:relative;height:22px}
.amt-ticks button{position:absolute;top:0;transform:translateX(-50%);font-size:.6875rem;line-height:22px;color:var(--muted);white-space:nowrap;padding:0 3px;border-radius:4px}
.amt-ticks button:hover{color:var(--fg)}
.amt-ticks button[aria-pressed="true"]{color:var(--accent);font-weight:600}
/* streak, new mark, review */
.side-top .brand{margin-right:auto}
.streak{font-size:var(--fs-xs);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 9px;margin-right:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fresh{display:flex;align-items:center;gap:6px;margin:-4px 18px 6px;font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.fresh::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.fresh.today{color:var(--muted)}
.fresh.today::before{background:var(--good)}
.item.unseen .t{font-weight:600}
.due{font-size:var(--fs-xs);color:var(--bg);background:var(--accent);border-radius:999px;padding:0 7px;margin-left:auto;font-variant-numeric:tabular-nums}
.due:not([hidden]) + .cnt{margin-left:6px}
.rv-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 18px 24px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center}
.rv-prog{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.rv-w{font-family:var(--serif);font-size:1.75rem;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.rv-m{font-size:var(--fs-l);margin:0}
.rv-n{font-size:var(--fs-s);color:var(--muted);margin:0}
.rv-from{font-size:var(--fs-xs);color:var(--muted)}
.rv-from button{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;font-size:inherit}
.rv-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rv-btns .btn{min-width:120px;padding:8px 16px}
.rv-meter{display:flex;gap:4px}
.rv-meter i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.rv-meter i.on{background:var(--good)}
.words .lv{font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.words .lv.due-now{color:var(--accent)}
/* device sync (public copy only) */
html:not(.static) .static-only{display:none!important}
#syncBtn{position:relative}
.sync-dot{position:absolute;right:1px;top:1px;width:6px;height:6px;border-radius:50%;background:transparent}
#syncBtn[data-s="ok"] .sync-dot,#syncBtn[data-s="idle"] .sync-dot{background:var(--good)}
#syncBtn[data-s="busy"] .sync-dot{background:var(--faint)}

.sync-in{max-width:min(380px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px}

.sync-st{margin:0;font-size:var(--fs-s)}
.sync-st[data-s="err"]{color:var(--bad)}
/* public copy (no Claude features): hide what needs Claude */
html.static .ai-only{display:none!important}
/* むずかしさで絞りこみ（もう一度押すと解除） */
.filters.lv-filters{padding-top:0;-webkit-mask-image:none;mask-image:none;flex-wrap:wrap}
/* 文のいいね */
.say.heart{position:relative}
/* いいね一覧：話題／文 */
.sent-likes{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sent-likes li{display:grid;grid-template-columns:minmax(0,1fr) 28px 28px;gap:4px 8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.sent-likes .se{display:block;font-family:var(--serif);font-size:var(--fs-l);line-height:1.6}
.sent-likes .sj{display:block;font-size:var(--fs-s);color:var(--muted)}
.sent-likes .sf{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.sent-likes .sf button,.dc-from button{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;font-size:inherit}
.story li.flash{background:color-mix(in srgb,var(--hl) 70%,transparent)}
/* メモ画面からもどる */
.cover-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cover-back{font-size:var(--fs-s);color:var(--muted);padding:4px 10px;border-radius:8px}
.cover-back:hover{background:var(--bubble);color:var(--fg)}
/* 書き取り */
.dc-src{display:flex;flex-wrap:wrap;gap:4px}

.dc-box{display:flex;flex-direction:column;gap:14px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.dc-top{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.dc-top .sp{flex:1}
.dc-play{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dc-big{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);flex:none}
.dc-big:hover{opacity:.88}
.dc-hint{font-family:var(--serif);font-size:var(--fs-l);color:var(--muted);letter-spacing:.03em;overflow-wrap:anywhere;margin:0}
.dc-in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-family:var(--serif);font-size:var(--fs-l);line-height:1.6;outline:0;resize:none}
.dc-in:focus{border-color:var(--faint)}
.dc-res{margin:0;font-size:var(--fs-s);color:var(--muted)}

.dc-ans{font-family:var(--serif);font-size:var(--fs-xl);line-height:1.7;margin:0;overflow-wrap:anywhere}

.dc-you{font-family:var(--serif);font-size:var(--fs-m);color:var(--muted);margin:0;overflow-wrap:anywhere}
.dc-you .x{color:var(--bad);text-decoration:line-through}

/* ===== 2026-10-06 仕上げ（色は変えずに、文字・余白・動き・押しやすさを整える） ===== */
/* 日本語は文節で改行（Chrome）、かなは見出しとボタンだけ詰める */
.l-title,.view-h,.blk h2,.blk h3,.brand,.nav-btn,.chip,.seg button,.btn,.pill,.txt-btn,.grp,.tip summary{font-feature-settings:"palt"}
.l-title{margin:0;font-family:var(--ui);font-size:1.375rem;font-weight:600;line-height:1.45;letter-spacing:.01em;text-wrap:balance}
.l-title + .lead{margin-top:-8px}
.lead{font-size:var(--fs-l);line-height:1.8}
.meta-line{gap:2px 0;align-items:center}
.meta-line > span + span::before{content:"·";margin:0 .6em;color:var(--faint)}
/* むずかしさの3本の棒 */
.lvl{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lvl .bars{display:inline-flex;align-items:flex-end;gap:2px;height:9px}
.lvl .bars i{display:block;width:3px;border-radius:1px;background:var(--line)}
.lvl .bars i:nth-child(1){height:4px}.lvl .bars i:nth-child(2){height:6.5px}.lvl .bars i:nth-child(3){height:9px}
.lvl .bars i.on{background:var(--muted)}
/* セクション見出し */
.blk h2{margin:0;font-family:var(--ui);font-size:var(--fs-m);font-weight:600;letter-spacing:.01em}
.a-block > .blk{scroll-margin-top:12px}
/* 上のバーの題名：本文の見出しが見えているあいだはかくす */
.top-title{transition:opacity .2s var(--ease)}
.top-title.dim{opacity:0}
/* 使い方の折りたたみ */
.tip{font-family:var(--ui);margin-top:-2px}
.tip summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-xs);color:var(--muted);padding:2px 6px 2px 0;border-radius:6px}
.tip summary::-webkit-details-marker{display:none}
.tip summary::before{content:"";width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s var(--ease)}
.tip[open] summary::before{transform:rotate(45deg) translate(-1px,-1px)}
.tip summary:hover{color:var(--fg)}
.tip .note{margin-top:4px;line-height:1.75;max-width:62ch}
.note.status{color:var(--accent);line-height:1.7}
/* 文の行：読んでいる文に縦線、ボタンはマウスを乗せたときだけ濃く */
.story li{position:relative}
.story li.speaking::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent)}
.story .say{position:relative}
.story .say::before{content:"";position:absolute;inset:-7px 0}
@media (hover:hover){
  .story li .say{opacity:.42;transition:opacity .16s,background-color var(--quick),color var(--quick),transform .12s var(--ease)}
  .story li:hover .say,.story li:focus-within .say,.story li .say[aria-pressed="true"],.story li.speaking .say{opacity:1}
}
.txt-btn .prog{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:2px}
/* 一覧：新着は小さな点、日付の見出しはスクロールしても上に残る */
.new-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.grp{position:sticky;top:0;z-index:1;background:var(--side);padding:12px 10px 5px;letter-spacing:.04em}
.filters{padding-inline:10px}
.side-foot{flex-direction:column;align-items:stretch;gap:7px}
.foot-row{display:flex;align-items:center;gap:8px;min-width:0}
.foot-row:has(> select[hidden]){display:none}
.foot-lbl{color:var(--muted)}
.voice-sel{max-width:100%;width:100%}
/* 押したときの手ごたえ */
.btn,.pill,.chip,.seg button,.say,.star,.icon-btn,.dc-big,.choice,.send,.txt-btn,.nav-btn,.item{touch-action:manipulation}
.btn:active,.pill:active,.chip:active,.seg button:active,.say:active,.star:active,.icon-btn:active,.dc-big:active,.choice:not(:disabled):active,.send:active,.txt-btn:active{transform:scale(.96)}
.btn:not(.ghost):hover{opacity:.9}
.pager button{transition:background-color var(--quick),border-color var(--quick),transform .2s var(--ease)}
.pager button:hover{transform:translateY(-1px)}
/* 指で操作する端末は、押せる範囲を広げる */
@media (pointer:coarse){
  .icon-btn{width:40px;height:40px}

}

.dc-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dc-src .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dc-q{margin:0;font-size:var(--fs-xl);line-height:1.75;text-wrap:pretty}
.dc-bank{display:flex;flex-wrap:wrap;gap:6px}

.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}

/* 読む速さ：ページの中は「速さ 1×」のボタン1つ（押すたびに切りかえ） */

/* 見出しの段：ページの題はどこも同じ、セクションは細い線で区切る */

/* 吹き出しのリンク */

.u-bubble .src a:hover{color:var(--fg)}
/* 文中の英語のかたまり：前後のすきまを詰め、2語までは途中で改行しない */
.mw{margin-inline:.12em}
.mw.nw{white-space:nowrap}
.mw.pp{margin-right:0}
.mw.pl{margin-left:0}
/* 英語の量を変えた瞬間：文が上から順に入れかわり、新しく英語になった部分がふっと色づく */
#story.morph .s-body{animation:morph .46s var(--ease) both;animation-delay:calc(var(--li,0) * 45ms)}

@keyframes morph{from{opacity:0;filter:blur(3px);transform:translateY(3px)}to{opacity:1;filter:none;transform:none}}
@keyframes chunkIn{0%{background:var(--accent-soft);color:var(--accent)}100%{background:var(--hl);color:inherit}}
/* スマホ：文のボタンは右に縦に並べて本文の幅を広く。混ぜ文の段では「訳」は文のタップで足りるので出さない */

/* スマホの入力欄：さわっていないときは1段に。入力の文字は16px（iPhoneで画面が拡大しないように） */

}
@media (pointer:coarse){ .comp-box textarea,.dc-in,.field,.search input,.cover textarea{font-size:16px} }
/* 一覧：分類の点はやめ、新着だけ点。連続日数は文字だけで控えめに。スクロールバーはマウスを乗せたときだけ */

.list{scrollbar-color:transparent transparent}
.list:hover,.list:focus-within{scrollbar-color:var(--line) transparent}
.lv-filters .flbl{flex:none;font-size:var(--fs-xs);color:var(--muted);padding:1px 2px 1px 0;align-self:center}
.lv-filters .chip{padding-inline:7px}
/* クイズ：選択肢は同じ幅で押しやすく、英語は英文の書体、空欄は線 */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,5.5em),1fr));gap:8px}
.choices.long{grid-template-columns:repeat(auto-fit,minmax(min(100%,12em),1fr))}

.blank{display:inline-block;width:2.6em;border-bottom:1.5px solid currentColor;vertical-align:-2px;margin-inline:.15em}
.talk-q{display:block}
.talk-q .say{display:inline-grid;vertical-align:-7px;margin-left:2px}
.talk-hint{margin:0;font-family:var(--ui);font-size:var(--fs-s);color:var(--muted)}

/* 書き取りのまとめ：どの語を落としたかと「何語中何語」 */

/* 英作文のヒントの単語：押すと入力欄に入る */
.dc-bank button{font-family:var(--serif);font-size:var(--fs-m);border:1px solid var(--line);border-radius:999px;padding:1px 11px;background:var(--bg);touch-action:manipulation}
.dc-bank button:hover{border-color:var(--faint)}
.dc-bank button.used{opacity:.38}
@media (pointer:coarse){ .dc-bank button{padding:5px 13px} }
/* 流し聞き：かくした英文には「タップで表示」 */
.fl-enw{position:relative}
.fl-en.veil{opacity:.55}
.veil-lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs-s);color:var(--muted);pointer-events:none}
/* いいね：表示の切りかえは左、すること（流す・書き取り）は右 */
.likes-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.likes-bar .sp{flex:1}
/* ===== 3回目の見直し ===== */
/* スマホ：文のボタンは、どの文でも右下の同じ位置（最後の行の右に席を取る） */
@media (max-width: 640px){
  .story li{padding-bottom:8px}

}
/* 一覧：太字はやめ、読んだ話題は少しうすく。日付の見出しに件数 */

.lead{font-family:var(--ui)}
.a-msg{font-family:var(--ui);font-size:var(--fs-m);line-height:1.8}
.a-msg .en{font-family:var(--serif);font-size:var(--fs-l);line-height:1.7}
.en-run{font-family:var(--serif);font-size:1.07em}
.ico-inline{display:inline-block;vertical-align:-2px}

.amt-top .n b{color:var(--accent)}

@media (max-width: 520px){ .dc-end-tools{display:flex} .dc-end-tools .btn{width:100%;min-height:44px} .dc-end-tools .txt-btn{flex:1;justify-content:center} }

.chip:disabled{opacity:.45;cursor:default}

@keyframes chunkInQ{0%{color:var(--accent)}100%{color:inherit}}
.amt-top{align-items:baseline}
.amt-top .n{font-family:var(--serif);font-size:var(--fs-l);color:var(--muted)}
.amt-top .n b{font-size:1.25rem;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;display:inline-block;min-width:1.2em;text-align:right}

.fl-ttl:hover{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
#flBox .dc-top{flex-wrap:nowrap}
#flBox .dc-top > :not(.fl-ttl){flex:none}
/* ===== 7回目の見直し ===== */
/* 「半分」の段は英語が文の半分以上：地は敷かず、書体のちがいと下線だけで見せる（段を上げるほど静かに） */
#story[data-lv="3"] .mw:not(.quiet){background:none;padding-inline:0;box-shadow:none;margin-inline:.22em;-webkit-box-decoration-break:slice;box-decoration-break:slice}
#story[data-lv="3"] .mw.pp{margin-right:0}
#story[data-lv="3"] .mw.pl,#story[data-lv="3"] .mw.pa,#story[data-lv="3"] .mw.first{margin-left:0}
/* 和文と英字の間は、使えるブラウザでは自動の空き（行頭がそろう） */
@supports (text-autospace: normal){
  #story[data-lv="3"] .s-text{text-autospace:normal}
  #story[data-lv="3"] .mw:not(.quiet){margin-inline:0}
}
#story[data-lv="3"] .mw[data-k]:hover{box-shadow:none;color:var(--accent)}
#story[data-lv="3"] .mw.ja{color:var(--accent)}
#story[data-lv="3"].morph .mw.new{animation-name:chunkInQ}
/* 書き取りのまとめ：とばした文は1行で（書いた文が主役） */
.dc-sum li.skip{padding:7px 0}
.dc-sum li.skip .se{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs-s);min-width:0}
/* 書き取りのまとめの下：今日ぜんぶの記録 */
.dc-today{margin:0;font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
#flBox .dc-big{background:color-mix(in srgb,var(--fg) 82%,var(--card))}
@media (max-width: 640px){
  .fl-en{font-size:clamp(1.5rem,7vw,1.875rem)}
  #flBox .fl-text{justify-content:flex-start;padding-top:8vh}
  #flBox .dc-big{width:48px;height:48px}
}

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* gloss（教材ごとの意味の辞書）のキー。lessons_tool.py の gkey と同じ決まり */
const gkey = s => String(s ?? '').toLowerCase().replace(/’/g, "'").replace(/[^a-z0-9' -]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^[' -]+|[' -]+$/g, '');
const unesc = s => String(s).replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
/* 混ぜ文 → HTML。英語のかたまり（{…}）は .mw。前後が括弧・句読点なら余白を詰める。inv（3/4 の段）では英語を地にして、残った日本語（.jr）に色 */
const MW_PRE_B = /[『「（(“]$/, MW_PRE_P = /[、。，]$/, MW_POST = /^[、。，．！？」』）)”]/, HAS_JA = /[぀-ヿ㐀-鿿]/;
/* 和文の中の「数＋単位」は途中で改行しない（29億2500万ドル など） */
const jaHtml = t => esc(t).replace(/第?\d[\d,.]*(?:[万億兆千百]\d*)*(?:周年|ドル|円|人|回|年|月|日|位|%|％|倍|件|語|本|話|巻|作|弾|期|歳|時|分|秒|号|部|章|代)?/g, m => `<span class="nwj">${m}</span>`);
/* inv（多めの段）では英語が地。和文の句読点は英語のものに置きかえ、残った日本語だけ色をつける */
const INV_P = {'、': ', ', '。': '.', '！': '!', '？': '?'};
const invHtml = x => x.split(/([、。！？])/).map(y => INV_P[y] != null ? INV_P[y] : HAS_JA.test(y) ? `<span class="jr">${jaHtml(y)}</span>` : esc(y)).join('');
const NU_FW = /^(a|an|the|is|are|was|were|be|been|to|of|in|on|at|for|as|by|with|from|so|and|or|but|he|she|it|they|we|you|i|me|him|them|his|her|its|their|my|our|your|this|that|there|will|can|has|have|had|do|does|did|not)$/i;
function mixHtml(s, inv, prev){
  /* ふだんは和文が地なので英語の前後の空白を詰める。多めの段は英語が地なので、英語と日本語の間に空きを入れる */
  const src = inv
    ? String(s ?? '').replace(/([^\x00-\x7F、。！？「『（])\s*\{/g, '$1 {').replace(/\}\s*([^\x00-\x7F、。！？」』）])/g, '} $1')
    : String(s ?? '').replace(/([^\x00-\x7F])\s+\{/g, '$1{').replace(/\}\s+([^\x00-\x7F])/g, '}$1');
  const parts = src.split(/\{([^{}]+)\}/);
  return parts.map((x, i) => {
    if(i % 2 === 0) return inv ? invHtml(x) : jaHtml(x);
    const pv = parts[i - 1] || '', nx = parts[i + 1] || '';
    const fresh = prev && (x.toLowerCase().match(/[a-z0-9]+(?:[.'’-][a-z0-9]+)*/g) || []).some(w => !prev.has(w));
    let body = prev ? x.split(/([A-Za-z0-9]+(?:[.'’-][A-Za-z0-9]+)*)/).map((y, k) => k % 2 && !prev.has(y.toLowerCase()) ? `<span class="nu">${nbh(esc(y))}</span>` : nbh(esc(y))).join('') : nbh(esc(x));
    /* 下線は続く語をつないで1本に。a・is・for などの短い語だけの線は引かない（中身の語を目立たせる） */
    if(prev) body = body.replace(/<\/span>(\s+)<span class="nu">/g, '$1').replace(/<span class="nu">([^<]+)<\/span>/g, (m, w) => w.trim().split(/\s+/).every(y => NU_FW.test(y)) ? w : m);
    const cls = ['mw', x.trim().split(/\s+/).length <= 2 ? 'nw' : '', MW_PRE_B.test(pv) ? 'pl' : MW_PRE_P.test(pv) ? 'pa' : '', MW_POST.test(nx) ? 'pp' : '', inv ? 'quiet' : '', i === 1 && !pv.trim() ? 'first' : '', fresh ? 'lvup' : ''].filter(Boolean).join(' ');
    return `<span class="${cls}" data-k="${gkey(x)}" role="button" tabindex="0">${body}</span>`;
  }).join('');
}
/* 日本語の説明の中の英語（2文字以上のつながり）を英文の書体に */
const enRuns = t => String(t ?? '').split(/([A-Za-z][A-Za-z0-9'’.\- ]*[A-Za-z0-9])/).map((x, i) => i % 2 ? `<span class="en-run" lang="en">${esc(x)}</span>` : esc(x)).join('');
const glossOf = (L, w) => (L && L.gloss && L.gloss[gkey(w)]) || '';
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('dn_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('dn_' + k, JSON.stringify(v)); }catch(e){} }
};
document.documentElement.lang = 'ja';
const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const jstToday = () => jstNow().toISOString().slice(0, 10);
const jstStamp = () => jstNow().toISOString().slice(0, 16);
const dayDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 864e5);
const jpDate = d => { if(!d) return ''; const [, m, dd] = d.slice(0, 10).split('-'); return `${+m}月${+dd}日`; };
const typing = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
const CAT = {anime:'アニメ', movie:'映画', manga:'漫画', own:'自分で追加'};
const LEVEL = {1:'やさしい', 2:'ふつう', 3:'ちょっとむずい'};
const SERIES = {haikyu:'ハイキュー!!', medalist:'メダリスト', frieren:'フリーレン'};
const HOT = 5000; /* 「人気」= この数以上いいねされたポスト */
/* English amount: 0 = all Japanese … 6 = all English */
const AMT = [
  {tick: '日本語', name: 'ぜんぶ日本語'},
  {tick: '単語', name: '英単語だけ英語', mix: 'mix'},
  {tick: '少し', name: '英語が少し', mix: 'q1'},
  {tick: '半分', name: '文の半分くらいが英語', mix: 'q2'},
  {tick: '多め', name: 'ほとんど英語', mix: 'q3'},
  {tick: '訳つき', name: 'ぜんぶ英語（訳つき）'},
  {tick: '英語', name: 'ぜんぶ英語'}
];
const GRAD_KEYS = ['q1', 'q2', 'q3'];
const hasBraces = x => typeof x === 'string' && /\{[^{}]+\}/.test(x) && !/\{[^}]*\{/.test(x);
const gradOk = L => Array.isArray(L.grad) && L.grad.length === L.lines.length && L.grad.every(g => g && GRAD_KEYS.every(k => hasBraces(g[k])));
const needsGrad = lv => lv >= 2 && lv <= 4;
const AMT_MAX = AMT.length - 1;
const HEART = '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>';
const ICON = {
  say:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>',
  star:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3.5 2.6 5.3 5.8.9-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.9z"/></svg>',
  heart:`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">${HEART}</svg>`,
  heartS:`<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">${HEART}</svg>`,
  heartL:`<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">${HEART}</svg>`,
  play:'<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  send:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  left:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  ok:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  ng:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>',
  phones:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 15v-3a7.5 7.5 0 0 1 15 0v3"/><rect x="3.5" y="14" width="4" height="6" rx="1.5"/><rect x="16.5" y="14" width="4" height="6" rx="1.5"/></svg>',

const BAD_VOICE = /\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy)\b/i;

function pickVoice(){

    if(!voice) voice = us[0] || vs[0] || null;

/* ---------- English tokens & key words ---------- */
function tokenize(s){
  const out = []; const re = /[A-Za-z0-9][A-Za-z0-9'’-]*/g; let m, last = 0;
  while((m = re.exec(s))){
    if(m.index > last) out.push({t: s.slice(last, m.index)});
    out.push({t: m[0], s: m.index, e: m.index + m[0].length, w: true});
    last = re.lastIndex;
  }
  if(last < s.length) out.push({t: s.slice(last)});
  return out;
}
const norm = x => String(x).toLowerCase().replace(/’/g, "'").replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
function forms(p){
  const f = new Set([p, p + 's', p + 'es', p + 'ed', p + 'd', p + 'ing', p + "'s"]);
  if(p.endsWith('e')) f.add(p.slice(0, -1) + 'ing');
  if(p.endsWith('y')){ f.add(p.slice(0, -1) + 'ies'); f.add(p.slice(0, -1) + 'ied'); }
  return f;
}
function markVocab(L, toks){
  const marks = {};
  const ws = toks.map((t, k) => t.w ? {k, v: norm(t.t)} : null).filter(Boolean);
  (L.words || []).forEach((wd, wi) => {
    const parts = norm(String(wd.w).replace(/~|\.\.\.|…/g, ' ')).split(' ').filter(Boolean);
    const tryMatch = ps => {
      if(!ps.length) return false;
      for(let a = 0; a + ps.length <= ws.length; a++){
        if(ps.every((p, b) => forms(p).has(ws[a + b].v))){
          ps.forEach((_, b) => { if(marks[ws[a + b].k] == null) marks[ws[a + b].k] = wi; });
          return true;
        }
      }
      return false;
    };
    if(!tryMatch(parts) && parts[0] === 'be') tryMatch(parts.slice(1));
  });
  return marks;
}
function enHtml(L, i){
  const toks = tokenize(L.lines[i].en); const marks = markVocab(L, toks);
  return toks.map((t, k) => {
    if(!t.w) return esc(t.t);
    const wi = marks[k];
    return wi != null
      ? `<span class="tk kw" data-s="${t.s}" data-e="${t.e}" data-wi="${wi}" role="button" tabindex="0">${nbh(esc(t.t))}</span>`
      : `<span class="tk" data-s="${t.s}" data-e="${t.e}">${nbh(esc(t.t))}</span>`;
  }).join('');
}

/* ---------- 書き取り（ディクテーション）と、日本語から英作文 ---------- */
/* やり方は2つ：listen＝英文を聞いて書く／write＝日本語を見て英語で書く（瞬間英作文。お手本とくらべる）。
   出す文：「すべて・レベル別・いいねした文」は終わりなし（まだ書いていない文を多めに、ぜんぶ合ったことのない文をときどき、直近30文はくり返さない）。
   「この話題」（src = lesson:<id>）は、その話題の文を順番に出して、最後にまとめを見せる。
   記録（今日の数・文ごとの成績）はこの端末のブラウザだけに残す（listen は dcStat/dcHist、write は wrStat/wrHist、話題ごとのまとめは dcLes）。 */
const DC = {src: LS.get('dcSrc', 'all'), mode: LS.get('dcMode', 'listen') === 'write' ? 'write' : 'listen', cur: null, phase: 'ask', typed: '', hint: 0, res: null, gave: false, recent: [], li: 0, order: [], lres: []};   /* 話題ごと：order＝出す文の番号の並び、li＝いま何番目、lres[文の番号]＝結果 */
if(String(DC.src).startsWith('lesson:')) DC.src = 'all';
/* 出す文の選び方（書き取り・流し聞き共通）：上の段は「この話題／いいねした文／すべて」、下の段はレベル */
function srcRows(attr, cur, extra){
  const nl = likedSents().length;
  const chip = (k, label, dis) => `<button class="chip" data-${attr}="${k}" aria-pressed="${cur === k}"${dis ? ' disabled' : ''}>${label}</button>`;
  return `<div class="dc-src" role="group" aria-label="出す文">${extra}${chip('all', 'すべて')}${nl || cur === 'liked' ? chip('liked', `いいね ${nl}`) : ''}<span class="sep" aria-hidden="true"></span>${[1, 2, 3].map(l => chip(String(l), LEVEL[l])).join('')}</div>`;
}
const DC_SRC = [['all', 'すべて'], ['1', 'やさしい'], ['2', 'ふつう'], ['3', 'ちょっとむずい'], ['liked', 'いいねした文']];
const NUMW = {zero: '0', one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9', ten: '10', eleven: '11', twelve: '12', thirteen: '13', fourteen: '14', fifteen: '15', sixteen: '16', seventeen: '17', eighteen: '18', nineteen: '19', twenty: '20', thirty: '30', forty: '40', fifty: '50', sixty: '60', seventy: '70', eighty: '80', ninety: '90', hundred: '100'};
function dcTok(s){
  const out = []; const re = /\d+(?:[.,]\d+)+|[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g; let m;   /* wc と同じ数え方（2.925・re-release は1語） */
  while((m = re.exec(s))){ const t = m[0].toLowerCase().replace(/’/g, "'").replace(/,/g, '').replace(/-/g, ''); out.push({s: m.index, e: m.index + m[0].length, raw: m[0], v: NUMW[t] || t}); }
  return out;
}
/* 正解と入力を単語ごとに突き合わせる（いちばん長く一致する並び＝LCS） */
function dcCompare(answer, typed){
  const A = dcTok(answer), B = dcTok(typed), n = A.length, m = B.length;
  const dp = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--) dp[i][j] = A[i].v === B[j].v ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  for(let i = 0, j = 0; i < n && j < m;){
    if(A[i].v === B[j].v){ A[i].ok = B[j].ok = true; i++; j++; }
    else if(dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  const hit = A.filter(x => x.ok).length;
  return {A, B, hit, total: n, perfect: n > 0 && hit === n && B.every(x => x.ok)};
}
/* 単語ごとに span で包む。anim のときは1語ずつ順に出す（--i） */
const nbh = x => x.replace(/(\w)-(?=\w)/g, '$1\u2011');   /* 英単語の中のハイフンで改行しない */
const markText = (s, toks, cls, anim) => { let out = '', p = 0, n = 0; toks.forEach(t => { const c = cls(t); out += nbh(esc(s.slice(p, t.s))) + (c || anim ? `<span class="${c || 'w'}"${anim ? ` style="--i:${n++}"` : ''}>${esc(t.raw)}</span>` : esc(t.raw)); p = t.e; }); return out + nbh(esc(s.slice(p))); };
const dcKey = k => (DC.mode === 'write' ? 'wr' : 'dc') + k;
function dcStats(mode){ const st = LS.get((mode || DC.mode) === 'write' ? 'wrStat' : 'dcStat', null); return st && st.day === jstToday() ? st : {day: jstToday(), n: 0, perfect: 0, words: 0, ok: 0}; }
const dcLessonId = () => String(DC.src).startsWith('lesson:') ? DC.src.slice(7) : '';
function dcPool(){
  if(DC.src === 'liked') return likedSents().map(([k]) => { const [id, i] = splitKey(k); return {id, i}; });
  const out = [];
  S.lessons.forEach(L => { if(DC.src !== 'all' && String(L.level) !== DC.src) return; (L.lines || []).forEach((ln, i) => { if(ln && ln.en && dcTok(ln.en).length >= 3) out.push({id: L.id, i}); }); });
  return out;
}
function dcPick(){
  const lid = dcLessonId();
  if(lid){ const L = S.byId[lid]; return L && DC.li < DC.order.length ? {id: lid, i: DC.order[DC.li]} : null; }
  const pool = dcPool(); if(!pool.length) return null;
  const hist = LS.get(dcKey('Hist'), {}), recent = new Set(DC.recent);
  let cand = pool.filter(p => !recent.has(sentKey(p.id, p.i))); if(!cand.length) cand = pool;
  const fresh = cand.filter(p => !hist[sentKey(p.id, p.i)]);
  const weak = cand.filter(p => { const h = hist[sentKey(p.id, p.i)]; return h && !h.ok; });
  const r = Math.random();
  const from = fresh.length && r < .7 ? fresh : weak.length && r < .9 ? weak : cand;
  return from[Math.floor(Math.random() * from.length)];
}
function dcLine(){ const c = DC.cur, L = c && S.byId[c.id]; return L && L.lines[c.i] ? {L, ln: L.lines[c.i], k: sentKey(c.id, c.i)} : null; }
function setDcOn(on){ const b = $('[data-act="dc-play"]'); if(b) b.classList.toggle('on', on); }
function dcPlay(slow){ const d = dcLine(); if(!d) return; stopSpeak(); speak(d.ln.en, {rate: slow ? RATE_SLOW(S.rate) : 0, onstart: () => setDcOn(true), onend: () => setDcOn(false)}); }
function dcReset(){ DC.phase = 'ask'; DC.typed = ''; DC.hint = 0; DC.res = null; DC.gave = false; }
function dcFocus(){ const t = $('#dcIn'); if(t) t.focus({preventScroll: true}); }
function dcStartLesson(id, mode, only){
  const L = S.byId[id]; if(!L) return;
  if(mode){ DC.mode = mode; LS.set('dcMode', mode); }
  DC.src = 'lesson:' + id; DC.li = 0; DC.order = only && only.length ? only : L.lines.map((_, i) => i); if(!only) DC.lres = []; DC.cur = {id, i: DC.order[0]}; dcReset();
  renderDict();
  if(DC.mode === 'listen') dcPlay();

/* 英作文のヒント：お手本の単語をばらばらに（文ごとに並びは固定） */
function dcBank(A, key){
  let seed = [...key].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);

  const ws = [...new Set(A.map(t => t.raw))];
  for(let i = ws.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [ws[i], ws[j]] = [ws[j], ws[i]]; }
  const used = new Set(dcTok(DC.typed).map(t => t.v));
  return ws.map(w => `<button type="button" data-bank="${esc(w)}"${used.has(w.toLowerCase().replace(/’/g, "'")) ? ' class="used"' : ''}>${esc(w)}</button>`).join('');
}

/* ---------- 流し聞き（文をランダムな順に流す） ---------- */
/* いいねした文（または全部・レベル別）をシャッフルして1文ずつ読み上げ、自動で次へ。日本語訳・英文はかくせる。
   「まねして言う間」をオンにすると、読み上げのあとに同じくらいの長さの間をあける（シャドーイング・リピーティング用）。
   流しているあいだは画面が消えないようにたのむ（Wake Lock。使えない端末では何もしない）。 */
const FL = {src: LS.get('flSrc', 'liked'), on: false, order: [], pos: -1, showJa: LS.get('flJa', true), hideEn: LS.get('flHideEn', false), gap: LS.get('flGap', false), tok: 0, timer: 0, wake: null, peek: false};
const FL_SRC = [['liked', 'いいねした文'], ['all', 'すべて'], ['1', 'やさしい'], ['2', 'ふつう'], ['3', 'ちょっとむずい']];
function flPool(){
  if(FL.src === 'liked') return likedSents().map(([k]) => k);
  const out = [];
  S.lessons.forEach(L => { if(FL.src !== 'all' && String(L.level) !== FL.src) return; (L.lines || []).forEach((ln, i) => { if(ln && ln.en) out.push(sentKey(L.id, i)); }); });
  return out;
}
/* 話題の順はランダム、話題の中は文の順（ひとつ前の文が文脈になり、聞き取りやすい） */
function flShuffle(avoid){
  const groups = new Map();
  flPool().forEach(k => { const [id, i] = splitKey(k); if(!groups.has(id)) groups.set(id, []); groups.get(id).push([+i, k]); });
  const g = [...groups.entries()];
  for(let i = g.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [g[i], g[j]] = [g[j], g[i]]; }
  const av = avoid ? splitKey(avoid)[0] : '';
  if(av && g.length > 1 && g[0][0] === av) g.push(g.shift());
  const a = g.flatMap(([, xs]) => xs.sort((x, y) => x[0] - y[0]).map(x => x[1]));
  FL.order = a; FL.pos = a.length ? 0 : -1;
}
function flCur(){ const k = FL.order[FL.pos]; if(!k) return null; const [id, i] = splitKey(k); const L = S.byId[id]; return L && L.lines[i] ? {k, L, i, ln: L.lines[i]} : null; }
async function flWake(on){
  try{
    if(on && !FL.wake && navigator.wakeLock){ const w = await navigator.wakeLock.request('screen'); FL.wake = w; w.addEventListener('release', () => { if(FL.wake === w) FL.wake = null; }); }
    else if(!on && FL.wake){ const w = FL.wake; FL.wake = null; await w.release(); }
  }catch(e){ FL.wake = null; }
}
function flStop(){ if(!FL.on && !FL.timer) return; FL.on = false; FL.tok++; clearTimeout(FL.timer); FL.timer = 0; flWake(false); }
function flMark(ci){
  const el = $('#flEn'); if(!el) return;
  el.querySelectorAll('.tk.now').forEach(t => t.classList.remove('now'));
  const t = [...el.querySelectorAll('.tk')].find(t => +t.dataset.s <= ci && ci < +t.dataset.e);
  if(t) t.classList.add('now');
}
function flSpeak(){
  const c = flCur(); if(!c) return;
  const tok = ++FL.tok; clearTimeout(FL.timer);
  let t0 = Date.now();
  speak(c.ln.en, {onstart: () => { t0 = Date.now(); const b = $('#flBox'); if(b) b.classList.add('speaking'); }, onword: flMark, onend: () => {
    if(tok !== FL.tok) return;
    const b = $('#flBox'); if(b) b.classList.remove('speaking'); flMark(-1);
    if(!FL.on) return;
    const wait = FL.gap ? Math.min(12000, Math.max(1600, (Date.now() - t0) * 1.15)) : 1300;
    const g = $('#flGap'); if(g && FL.gap){ g.style.setProperty('--d', wait + 'ms'); g.classList.remove('run'); void g.offsetWidth; g.classList.add('run'); }
    FL.timer = setTimeout(() => { FL.timer = 0; if(tok === FL.tok && FL.on) flStep(1); }, wait);
  }});
}
function flStep(d){
  if(!FL.order.length) flShuffle();
  if(!FL.order.length){ renderFlow(true); return; }
  let p = FL.pos + d;
  if(p >= FL.order.length){ flShuffle(FL.order[FL.order.length - 1]); p = 0; }
  FL.pos = Math.max(0, p); FL.peek = false; clearTimeout(FL.timer); FL.timer = 0;
  renderFlow(true, true);
  if(FL.on) flSpeak(); else stopSpeak();
}
function flToggle(){
  if(FL.on){ flStop(); stopSpeak(); renderFlow(true); return; }
  if(!FL.order.length || !flCur()) flShuffle();
  if(!flCur()){ toast(FL.src === 'liked' ? '先に、話題の文を ♡ でいいねしてください' : '流せる文がありません'); return; }
  FL.on = true; flWake(true); renderFlow(true); flSpeak();
}

      <div class="fl-enw"><p class="fl-en${veil ? ' veil' : ''}" id="flEn" lang="en"${veil ? ' data-act="fl-peek" role="button" tabindex="0" aria-label="かくした英文を見る"' : ''}>${toks}</p>${veil ? '<span class="veil-lbl" aria-hidden="true"><span>英文はかくしています・タップで表示</span></span>' : ''}</div>
      ${FL.showJa ? `<p class="fl-ja">${esc(c.ln.ja)}</p>` : ''}
    </div>
    ${FL.gap ? '<div class="fl-gap" id="flGap" aria-hidden="true"><span>まねして言ってみましょう</span><i></i></div>' : ''}
    <div class="fl-ctrl">
      <span class="fl-side"><button class="say heart" data-sent="${esc(c.k)}" aria-pressed="${!!S.state.sents[c.k]}" aria-label="この文にいいね" title="この文にいいね">${ICON.heart}</button></span>

  $('#thread').innerHTML = html;

function normalizeLesson(r){

  if(!lines.length) return null;
  const grad = raw.map(l => ({q1: String(l.q1 || ''), q2: String(l.q2 || ''), q3: String(l.q3 || '')}));
  const quiz = (Array.isArray(r.quiz) ? r.quiz : []).filter(q => q && q.q && Array.isArray(q.choices) && Number.isInteger(q.a) && q.a >= 0 && q.a < q.choices.length)
    .map(q => ({q: String(q.q), choices: q.choices.map(String), a: q.a, why: q.why ? String(q.why) : ''}));
  return {
    title: String(r.title || '新しいノート').slice(0, 40), summary: String(r.summary || ''),
    cat: ['anime', 'movie', 'manga'].includes(r.cat) ? r.cat : 'other', level: [1, 2, 3].includes(r.level) ? r.level : 2,
    lines, words: (Array.isArray(r.words) ? r.words : []).filter(w => w && w.w).map(w => ({w: String(w.w), ja: String(w.ja || ''), note: w.note ? String(w.note) : ''})),
    grammar: r.grammar && r.grammar.title ? {title: String(r.grammar.title), body: String(r.grammar.body || ''), ex: (r.grammar.ex || []).filter(e => e && e.en).map(e => ({en: String(e.en), ja: String(e.ja || '')}))} : null,
    quiz, talk: r.talk && r.talk.q ? {q: String(r.talk.q), ja: String(r.talk.ja || ''), hint: String(r.talk.hint || '')} : null,
    ...(gradOk({lines, grad}) ? {grad} : {})
  };
}

function syncSend(){ const b = $('#sendBtn'); if(b) b.disabled = !S.busy && !$('#msg').value.trim(); }
async function send(){
  if(S.busy){ if(S.ctl) S.ctl.abort(); return; }
  const box = $('#msg'); const text = box.value.trim();
  const L = S.byId[S.cur]; if(!text || !L) return;
  if(!S.sample){ setCompNote('この画面ではAIを使えません'); return; }
  const id = S.cur; const mode = S.compMode;
  const chat = chatOf(id);
  chat.push({role: 'user', content: text, mode}); saveChat(id);
  box.value = ''; autosize(); syncSend();
  const cbox = $('#chat');
  cbox.insertAdjacentHTML('beforeend', msgHtml(chat[chat.length - 1]));
  cbox.insertAdjacentHTML('beforeend', '<div class="a-msg" id="pending"><p class="thinking">考えています</p></div>');
  const pend = $('#pending'); pend.removeAttribute('id');
  scrollBottom();
  const opener = chat.find(t => t.local && t.mode === 'talk');
  const turns = chat.filter(t => t.mode === mode && !t.local).slice(-16).map(t => ({role: t.role, content: t.content}));
  const input = [{role: 'user', content: mode === 'talk' ? talkRules(L, opener ? opener.q : '') : askRules(L)}, ...turns];
  S.ctl = new AbortController(); setBusy(true);
  const paint = t => { pend.innerHTML = mode === 'talk' ? talkHtml(t).html : mdHtml(t); };
  try{
    const r = await S.sample(input, {modelTier: 'quick', cache: false, signal: S.ctl.signal, onText: ({text}) => { paint(text); scrollBottom(true); }});
    chat.push({role: 'assistant', content: r.text, mode}); saveChat(id);
    pend.outerHTML = msgHtml(chat[chat.length - 1]);
  }catch(e){
    if(e && e.text && e.code !== 'refused'){
      chat.push({role: 'assistant', content: e.text, mode}); saveChat(id);
      pend.outerHTML = msgHtml(chat[chat.length - 1]);
    } else if(e && e.code === 'cancelled'){
      pend.remove();
    } else {
      pend.innerHTML = `<p class="err">${esc(errText(e))}</p>`;
    }
  }finally{
    setBusy(false); S.ctl = null; if(S.cur === id) scrollBottom(true);
  }
}
function startTalk(){
  const L = S.byId[S.cur]; if(!L || !L.talk) return;
  const id = S.cur; const chat = chatOf(id);
  const last = chat[chat.length - 1];
  if(!(last && last.local && last.q === L.talk.q)){
    chat.push({role: 'assistant', content: `${L.talk.q}\n訳：${L.talk.ja}`, mode: 'talk', local: true, q: L.talk.q}); saveChat(id);
    $('#chat').insertAdjacentHTML('beforeend', msgHtml(chat[chat.length - 1]));
  }
  setCompMode('talk'); scrollBottom(true);
  speak(L.talk.q);
  $('#msg').focus();
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !e.isComposing){ e.preventDefault(); toggleCover(); return; }
  if(!$('#cover').hidden || e.ctrlKey || e.metaKey || e.altKey || typing(document.activeElement)) return;
  const k = e.key;
  if(k === '?'){ e.preventDefault(); toggleKeys(); return; }
  if(!$('#keys').hidden){ toggleKeys(false); }
  if(k === '/'){ e.preventDefault(); $('#q').focus(); $('#q').select(); }
  else if(k === 'j' || k === 'J'){ step(1); }
  else if(k === 'k' || k === 'K'){ step(-1); }
  else if((k === 'l' || k === 'L') && S.view === 'lesson'){ toggleLike(S.cur); }
  else if((k === 'p' || k === 'P') && S.view === 'lesson'){ playAll(); }
  else if(/^[0-6]$/.test(k) && S.view === 'lesson' && $('#story')){ setAmount(+k); }
  else if(e.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('kw')){ openPop(document.activeElement); }
  else if(e.key === 'Enter' && document.activeElement && document.activeElement.matches('#story .mw[data-k]')){ toggleChunk(document.activeElement); }
  else if(S.view === 'dict' && DC.phase === 'done' && k === 'Enter' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')){ e.preventDefault(); dcNew(true); }
  else if(S.view === 'dict' && k === 'Tab' && DC.mode === 'listen' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')){ e.preventDefault(); dcPlay(e.shiftKey); }
  else if(S.view === 'flow' && (k === 'ArrowRight' || k === 'ArrowLeft')){ e.preventDefault(); flStep(k === 'ArrowRight' ? 1 : -1); }
  else if(S.view === 'flow' && k === ' ' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')){ e.preventDefault(); flToggle(); }
  else if(S.view === 'review' && RV.i < RV.queue.length){
    if(k === ' ' && !RV.shown){ e.preventDefault(); RV.shown = true; renderReview(); }
    else if(RV.shown && (k === 'ArrowRight' || k === 'Enter')){ e.preventDefault(); rvAnswer(true); }
    else if(RV.shown && k === 'ArrowLeft'){ e.preventDefault(); rvAnswer(false); }
  }
});

  const wtk = t.closest('#story .tk'); if(wtk && !(window.getSelection && String(window.getSelection()).length)){ e.stopPropagation(); popFor === wtk ? closePop() : openPop(wtk); return; }
  const sayLine = t.closest('[data-say-line]'); if(sayLine){ stopSpeak(); speakLine(+sayLine.dataset.sayLine); return; }
  const say = t.closest('[data-say]'); if(say){ stopSpeak(); speak(say.dataset.say); return; }
  const star = t.closest('[data-star]'); if(star){ toggleWord(star.dataset.star, star.dataset.from); return; }
  const like = t.closest('[data-like]'); if(like){ toggleLike(like.dataset.like); return; }
  const open = t.closest('[data-open]'); if(open){ openLesson(open.dataset.open, open.dataset.seq || (open.closest('.pager') ? undefined : null)); if(open.dataset.line != null) flashLine(+open.dataset.line); return; }
  const lt = t.closest('[data-ltab]'); if(lt){ S.likesTab = lt.dataset.ltab; LS.set('likesTab', S.likesTab); renderLikes(true); return; }
  const ds = t.closest('[data-dcsrc]'); if(ds){ const v = ds.dataset.dcsrc; if(v.startsWith('lesson:')){ dcStartLesson(v.slice(7)); return; } DC.src = v; LS.set('dcSrc', v); DC.recent = []; DC.cur = null; dcNew(false); return; }
  const dm = t.closest('[data-dcmode]'); if(dm){ const m = dm.dataset.dcmode; if(m !== DC.mode){ DC.mode = m; LS.set('dcMode', m); const lid = dcLessonId(); if(lid){ dcStartLesson(lid); return; } else { DC.cur = null; dcNew(false); } } return; }
  const fs = t.closest('[data-flsrc]'); if(fs){ FL.src = fs.dataset.flsrc; LS.set('flSrc', FL.src); flShuffle(); renderFlow(true, true); if(FL.on) flSpeak(); return; }
  const amt = t.closest('button[data-amt]'); if(amt){ setAmount(+amt.dataset.amt); return; }
  const bk = t.closest('[data-bank]'); if(bk){ const ta = $('#dcIn'); if(ta){ ta.value = (ta.value.replace(/\s+$/, '') + ' ' + bk.dataset.bank).replace(/^\s+/, ''); DC.typed = ta.value; bk.classList.add('used'); ta.focus({preventScroll: true}); } return; }
  const li = t.closest('#story li');
  if(li){
    if(window.getSelection && String(window.getSelection()).length) return;
    const L = S.byId[S.cur]; const i = +li.dataset.i; nextTap(L, i); redrawLine(L, i);
    return;
  }
  const ch = t.closest('.choice'); if(ch && !ch.disabled){ answer(+ch.dataset.q, +ch.dataset.c); return; }
  const m = t.closest('.words.blur .m'); if(m){ m.classList.toggle('show'); return; }
  const act = t.closest('[data-act]'); if(!act) return;
  const a = act.dataset.act;
  if(a === 'playall') playAll();
  else if(a === 'talk') startTalk();
  else if(a === 'retry') retryQuiz();
  else if(a === 'save-draft') saveDraft();
  else if(a === 'drop-draft'){ delete S.byId.__draft; const first = S.lessons[0]; if(first) openLesson(first.id); else renderNew(); }
  else if(a === 'review') startReview(false);
  else if(a === 'review-all') startReview(true);
  else if(a === 'rv-show'){ RV.shown = true; renderReview(); }
  else if(a === 'rv-ok') rvAnswer(true);
  else if(a === 'rv-no') rvAnswer(false);
  else if(a === 'words') renderWords();
  else if(a === 'rate-cycle'){ const i = RATES.findIndex(([r]) => r === S.rate); setRate(RATES[(i + 1) % RATES.length][0], false); }
  else if(a === 'dc-play') dcPlay(false);
  else if(a === 'dc-slow') dcPlay(true);
  else if(a === 'dc-hint'){ DC.typed = $('#dcIn') ? $('#dcIn').value : DC.typed; DC.hint = Math.min(2, DC.hint + 1); renderDict(true); const ti = $('#dcIn'); if(ti) ti.focus({preventScroll: true}); }
  else if(a === 'dc-check') dcCheck(false);
  else if(a === 'dc-give') dcCheck(true);
  else if(a === 'dc-next') dcNew(true);
  else if(a === 'dc-retry'){ dcReset(); renderDict(true); if(DC.mode === 'listen') dcPlay(false); dcFocus(); }
  else if(a === 'dc-skip'){ if(dcLessonId()) DC.lres[DC.cur.i] = null; dcNew(true); }
  else if(a === 'dc-lesson'){ dcStartLesson(S.cur, act.dataset.dm); }
  else if(a === 'dc-lesson-again'){ const lid = dcLessonId(); if(lid) dcStartLesson(lid); }
  else if(a === 'dc-lesson-skipped'){ const lid = dcLessonId(), L = S.byId[lid]; if(L) dcStartLesson(lid, null, L.lines.map((_, i) => i).filter(i => !DC.lres[i])); }
  else if(a === 'dc-all'){ DC.src = 'all'; LS.set('dcSrc', 'all'); DC.cur = null; dcNew(false); }
  else if(a === 'dict-liked'){ DC.src = 'liked'; LS.set('dcSrc', 'liked'); DC.recent = []; DC.cur = null; renderDict(); }
  else if(a === 'flow-liked'){ FL.src = 'liked'; LS.set('flSrc', 'liked'); flShuffle(); renderFlow(); flToggle(); }
  else if(a === 'fl-toggle') flToggle();
  else if(a === 'fl-next') flStep(1);
  else if(a === 'fl-prev') flStep(-1);
  else if(a === 'fl-ja'){ FL.showJa = !FL.showJa; LS.set('flJa', FL.showJa); renderFlow(true); }
  else if(a === 'fl-en'){ FL.hideEn = !FL.hideEn; FL.peek = false; LS.set('flHideEn', FL.hideEn); renderFlow(true); }
  else if(a === 'fl-gap'){ FL.gap = !FL.gap; LS.set('flGap', FL.gap); renderFlow(true); }
  else if(a === 'fl-peek'){ FL.peek = true; renderFlow(true); }
  else if(a === 'blur'){ blurMeanings = !blurMeanings; LS.set('blur', blurMeanings); renderWords(true); }
}
